<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tool.name} + ' - DevTools Station'">色感测试 - DevTools Station</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --bg: #fdf2f8; --card-bg: #ffffff; --text: #4a3055;
            --text-secondary: #9a7eab; --accent: #ec4899; --accent2: #a855f7;
            --accent-light: #fce7f3; --border: #f0d4e8;
            --shadow: 0 8px 32px rgba(236, 72, 153, 0.12);
            --radius: 20px; --radius-sm: 14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 30%, #f5f3ff 60%, #fdf2f8 100%);
            background-size: 400% 400%; animation: bgFloat 15s ease infinite;
            min-height: 100vh; color: var(--text); line-height: 1.6;
            display: flex; flex-direction: column; align-items: center; padding: 20px;
        }
        @keyframes bgFloat {
            0%,100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .container { max-width: 520px; width: 100%; position: relative; z-index: 1; }

        h1 {
            text-align: center; font-size: 2em; margin-bottom: 4px;
            background: linear-gradient(135deg, #ec4899, #a855f7, #f472b6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .subtitle { text-align: center; color: #c084ba; font-size: 0.95em; margin-bottom: 24px; }

        .card {
            background: var(--card-bg); border-radius: var(--radius);
            padding: 28px 24px; margin-bottom: 16px;
            box-shadow: var(--shadow); border: 2px solid var(--border);
            position: relative;
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #f472b6, #e879f9, #ec4899, #f472b6);
            background-size: 300% 100%; animation: shimmer 3s ease infinite;
            border-radius: var(--radius) var(--radius) 0 0;
        }
        @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

        /* Stats bar */
        .stats {
            display: flex; justify-content: space-around; gap: 8px;
            margin-bottom: 16px;
        }
        .stat-item {
            text-align: center; flex: 1;
            background: var(--card-bg); border: 2px solid var(--border);
            border-radius: var(--radius-sm); padding: 12px 8px;
        }
        .stat-value {
            font-size: 1.8em; font-weight: 800;
            background: linear-gradient(135deg, #ec4899, #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .stat-label { font-size: 0.75em; color: var(--text-secondary); margin-top: 2px; }

        /* Difficulty indicator */
        .difficulty-bar {
            display: flex; gap: 4px; margin-bottom: 16px;
            justify-content: center; align-items: center;
        }
        .difficulty-bar .dl { font-size: 0.8em; color: var(--text-secondary); margin-right: 8px; }
        .diff-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #e8d5f5; transition: all 0.3s ease;
        }
        .diff-dot.filled { background: var(--accent); transform: scale(1.3); box-shadow: 0 0 8px rgba(236,72,153,0.4); }

        /* Color grid */
        .color-grid {
            display: grid; gap: 10px; margin-bottom: 16px;
            width: 100%; max-width: 360px; margin-left: auto; margin-right: auto;
        }
        .color-cell {
            aspect-ratio: 1; border-radius: 14px; cursor: pointer;
            transition: all 0.15s ease; position: relative;
            border: 3px solid transparent;
        }
        .color-cell:hover { transform: scale(1.05); box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
        .color-cell.wrong {
            animation: shake 0.5s ease; border-color: #ef4444 !important;
        }
        .color-cell.correct {
            animation: popCorrect 0.5s ease; border-color: #22c55e !important;
            box-shadow: 0 0 24px rgba(34,197,94,0.3);
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
        @keyframes popCorrect {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 12px 28px; border-radius: 25px; border: none;
            font-size: 1em; font-weight: 700; cursor: pointer;
            transition: all 0.3s ease; font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f472b6, #a855f7);
            color: #fff; box-shadow: 0 4px 16px rgba(244,114,182,0.35);
            width: 100%; justify-content: center;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(244,114,182,0.45); }
        .btn-outline {
            background: #fff; color: var(--accent);
            border: 2px solid var(--accent);
        }
        .btn-outline:hover { background: var(--accent-light); }
        .btn-sm { padding: 8px 18px; font-size: 0.85em; border-radius: 20px; }

        .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }

        .hidden { display: none !important; }

        /* Result screen */
        .result-section { text-align: center; }
        .score-big {
            font-size: 4em; font-weight: 800;
            background: linear-gradient(135deg, #ec4899, #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .rank-badge {
            display: inline-block; padding: 8px 24px; border-radius: 25px;
            font-weight: 700; font-size: 1.1em; margin: 8px 0;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        .feedback-msg {
            background: var(--accent-light); border-radius: var(--radius-sm);
            padding: 16px; margin: 12px 0; border: 2px dashed var(--border);
            font-size: 0.9em; color: var(--text);
        }

        /* Toast */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #f472b6, #a855f7);
            color: #fff; padding: 12px 24px; border-radius: 30px;
            font-weight: 600; z-index: 200;
            box-shadow: 0 8px 30px rgba(244,114,182,0.4);
            animation: toastIn 0.4s ease, toastOut 0.4s ease 1.8s forwards;
            white-space: nowrap; font-size: 0.9em;
        }
        @keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(-20px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity:1; } to { opacity:0; transform: translateX(-50%) translateY(-20px); } }

        /* Hearts background */
        .hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .float-heart {
            position: absolute; font-size: 1.2em; opacity: 0;
            animation: heartFloat 10s ease-in-out infinite;
        }
        @keyframes heartFloat {
            0% { opacity: 0; transform: translateY(100vh) scale(0.5) rotate(0deg); }
            15% { opacity: 0.6; }
            85% { opacity: 0.6; }
            100% { opacity: 0; transform: translateY(-10vh) scale(1.1) rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="hearts" id="heartsEl"></div>

<div class="container">
    <h1>🎨 色感测试挑战</h1>
    <p class="subtitle">你能分辨多少种颜色？找出与众不同的那个色块 ✨</p>

    <!-- Stats -->
    <div class="stats">
        <div class="stat-item">
            <div class="stat-value" id="scoreDisplay">0</div>
            <div class="stat-label">⭐ 得分</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="levelDisplay">1</div>
            <div class="stat-label">🎯 关卡</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="streakDisplay">0</div>
            <div class="stat-label">🔥 连击</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="livesDisplay">3</div>
            <div class="stat-label">💖 生命</div>
        </div>
    </div>

    <!-- Difficulty -->
    <div class="difficulty-bar">
        <span class="dl">难度:</span>
        <div class="diff-dot" id="dd1"></div>
        <div class="diff-dot" id="dd2"></div>
        <div class="diff-dot" id="dd3"></div>
        <div class="diff-dot" id="dd4"></div>
        <div class="diff-dot" id="dd5"></div>
        <div class="diff-dot" id="dd6"></div>
        <div class="diff-dot" id="dd7"></div>
        <div class="diff-dot" id="dd8"></div>
    </div>

    <!-- Game area -->
    <div class="card" id="gameArea">
        <p style="text-align:center;color:var(--text-secondary);margin-bottom:12px;font-weight:600;" id="roundHint">
            找出颜色不同的那个方块 👆
        </p>
        <div class="color-grid" id="colorGrid"></div>
    </div>

    <!-- Result screen -->
    <div class="card hidden" id="resultScreen">
        <div class="result-section">
            <div class="score-big" id="finalScore">0</div>
            <p style="color:var(--text-secondary);margin-bottom:8px;">最终得分</p>
            <div id="rankBadge"></div>
            <p id="rankDesc" style="font-size:1em;margin:8px 0;color:var(--text);"></p>
            <div class="feedback-msg" id="feedbackMsg"></div>
            <button class="btn btn-primary" onclick="restartGame()">
                🔄 再来一次
            </button>
            <button class="btn btn-outline btn-sm" onclick="shareResult()" style="margin-top:10px;width:100%;">
                📋 复制成绩
            </button>
        </div>
    </div>
</div>

<script>
(function(){
    const TOTAL_ROWS = 3, TOTAL_COLS = 3;
    const GRID_SIZE = 9; // 3x3
    let score = 0, level = 1, streak = 0, maxStreak = 0, lives = 3;
    let baseColor = null, diffIndex = -1, baseDiff = 35;
    let gameActive = true;
    let answered = false;

    function hsl(h, s, l) { return `hsl(${h},${s}%,${l}%)`; }

    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function generateRound() {
        answered = false;
        if (!gameActive) return;

        // Generate a random base color
        const hue = randInt(0, 360);
        const sat = randInt(40, 80);
        const light = randInt(40, 65);

        baseColor = { h: hue, s: sat, l: light };

        // The difference decreases as level increases
        const diff = Math.max(3, baseDiff - (level - 1) * 3);

        // Pick the different cell
        diffIndex = randInt(0, GRID_SIZE - 1);

        // Slightly alter for the different cell
        const diffHue = randInt(0,1) ? (hue + diff) % 360 : (hue - diff + 360) % 360;
        const diffSat = Math.min(100, Math.max(0, sat + (randInt(0,1) ? diff/2 : -diff/2)));
        const diffLight = Math.min(90, Math.max(10, light + (randInt(0,1) ? diff/2 : -diff/2)));

        // Render grid
        const grid = document.getElementById('colorGrid');
        let html = '';
        for (let i = 0; i < GRID_SIZE; i++) {
            if (i === diffIndex) {
                html += `<div class="color-cell" style="background:${hsl(diffHue, diffSat, diffLight)}" onclick="checkAnswer(${i}, this)" data-idx="${i}"></div>`;
            } else {
                html += `<div class="color-cell" style="background:${hsl(hue, sat, light)}" onclick="checkAnswer(${i}, this)" data-idx="${i}"></div>`;
            }
        }
        grid.style.gridTemplateColumns = `repeat(${TOTAL_COLS}, 1fr)`;
        grid.innerHTML = html;

        // Update difficulty dots
        for (let d = 1; d <= 8; d++) {
            const dot = document.getElementById('dd' + d);
            if (d <= Math.min(8, Math.ceil(level / 2))) {
                dot.classList.add('filled');
            } else {
                dot.classList.remove('filled');
            }
        }

        document.getElementById('levelDisplay').textContent = level;
        let hintText, hintEmoji;
        if (level <= 4) { hintText = '找出颜色不同的那个方块 👆'; hintEmoji = '😊'; }
        else if (level <= 8) { hintText = '开始有难度了，加油！💪'; hintEmoji = '🤔'; }
        else if (level <= 12) { hintText = '颜色越来越接近了...🔍'; hintEmoji = '😵'; }
        else if (level <= 16) { hintText = '超高难度！你能看出区别吗？👀'; hintEmoji = '🔥'; }
        else { hintText = '传说级色感挑战！🌟'; hintEmoji = '🏆'; }
        document.getElementById('roundHint').textContent = hintText;
    }

    window.checkAnswer = function(idx, el) {
        if (!gameActive || answered) return;
        answered = true;

        if (idx === diffIndex) {
            // Correct!
            el.classList.add('correct');
            streak++;
            if (streak > maxStreak) maxStreak = streak;
            const bonus = 1 + Math.floor(streak / 3);
            score += bonus;
            level++;
            document.getElementById('streakDisplay').textContent = streak;
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('levelDisplay').textContent = level;
            showToast('✅ 正确！+' + bonus + '⭐');

            setTimeout(generateRound, 800);
        } else {
            // Wrong
            el.classList.add('wrong');
            // Highlight correct answer
            const correctEl = document.querySelector(`.color-cell[data-idx="${diffIndex}"]`);
            if (correctEl) {
                setTimeout(() => correctEl.classList.add('correct'), 400);
            }
            streak = 0;
            lives--;
            document.getElementById('streakDisplay').textContent = streak;
            document.getElementById('livesDisplay').textContent = lives;

            if (lives <= 0) {
                setTimeout(endGame, 1000);
            } else {
                showToast(`💔 选错了！还剩 ${lives} 条命`);
                setTimeout(generateRound, 1200);
            }
        }
    };

    function endGame() {
        gameActive = false;
        document.getElementById('gameArea').classList.add('hidden');
        document.getElementById('resultScreen').classList.remove('hidden');
        document.getElementById('finalScore').textContent = score;

        let rank, rankClass, desc, feedback, emoji;
        if (score >= 60) {
            rank = '🌈 色感大师'; rankClass = '#ec4899'; emoji = '🏆';
            desc = '你的色感已经超越了99%的人类！';
            feedback = '🎨 你对色彩的敏感度令人惊叹！可以考虑从事设计、摄影或艺术相关领域，天赋爆表！';
        } else if (score >= 40) {
            rank = '🎨 色彩达人'; rankClass = '#a855f7'; emoji = '💎';
            desc = '非常出色的色感，配色一定很美！';
            feedback = '🌸 你对颜色有很好的直觉，衣柜搭配一定很棒！继续培养，说不定能成为设计师～';
        } else if (score >= 25) {
            rank = '✨ 色彩爱好者'; rankClass = '#f472b6'; emoji = '🌟';
            desc = '不错的色感，比大多数人都厉害！';
            feedback = '💕 你的色感不错哦！平时搭配衣服、布置房间应该都很有品味～再练练会更棒！';
        } else if (score >= 12) {
            rank = '🌷 色彩学徒'; rankClass = '#ec4899'; emoji = '🌷';
            desc = '继续加油！色彩感知可以慢慢培养～';
            feedback = '🌱 每个人对色彩的感知不同，多观察大自然和艺术作品，色感会越来越好哦！';
        } else {
            rank = '🌼 色彩新秀'; rankClass = '#c084ba'; emoji = '🌼';
            desc = '哇，你的视界和其他人不太一样呢～';
            feedback = '🦋 也许你只是需要更多练习！色感是可以培养的，多看看调色盘和配色方案吧～';
        }

        document.getElementById('rankBadge').innerHTML =
            '<div class="rank-badge" style="background:linear-gradient(135deg,' + rankClass + '20,' + rankClass + '30);color:' + rankClass + ';border:2px solid ' + rankClass + ';">' +
            emoji + ' ' + rank + '</div>';
        document.getElementById('rankDesc').textContent = desc;
        document.getElementById('feedbackMsg').innerHTML =
            '<p>' + feedback + '</p>' +
            '<p style="margin-top:8px;color:var(--text-secondary);">🔥 最高连击: ' + maxStreak + ' | 🎯 达到第 ' + level + ' 关</p>';
    }

    window.restartGame = function() {
        score = 0; level = 1; streak = 0; maxStreak = 0; lives = 3;
        gameActive = true; answered = false; baseDiff = 35;
        document.getElementById('scoreDisplay').textContent = '0';
        document.getElementById('levelDisplay').textContent = '1';
        document.getElementById('streakDisplay').textContent = '0';
        document.getElementById('livesDisplay').textContent = '3';
        document.getElementById('gameArea').classList.remove('hidden');
        document.getElementById('resultScreen').classList.add('hidden');
        generateRound();
    };

    window.shareResult = function() {
        const text = '🎨 我的色感测试成绩：' + score + '分！\n' +
            '🔥 最高连击：' + maxStreak + ' | 🎯 达到第 ' + level + ' 关\n' +
            '来测测你的色感有多强吧～\n' + window.location.href;
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => showToast('📋 成绩已复制，快发给朋友挑战！'));
        }
    };

    // Background floating hearts
    function createHearts() {
        const cont = document.getElementById('heartsEl');
        const emojis = ['🌸','🎀','💕','✨','🦋','💖','🌷','🎨','💝','🌟'];
        for (let i = 0; i < 10; i++) {
            const h = document.createElement('span');
            h.className = 'float-heart';
            h.textContent = emojis[i];
            h.style.left = (Math.random() * 96) + '%';
            h.style.animationDelay = (Math.random() * 12) + 's';
            h.style.animationDuration = (8 + Math.random() * 10) + 's';
            cont.appendChild(h);
        }
    }

    function showToast(msg) {
        const old = document.querySelector('.toast');
        if (old) old.remove();
        const t = document.createElement('div');
        t.className = 'toast'; t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2200);
    }

    createHearts();
    generateRound();
})();
</script>
</body>
</html>
