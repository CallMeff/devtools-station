<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tool.name} + ' - DevTools Station'">工作日赚钱计时器 - DevTools Station</title>
    <meta name="description" th:content="${tool.description}">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script>(function(){var t=localStorage.getItem('devtools-theme');if(t){document.documentElement.className='theme-'+t;}})()</script>
    <link rel="stylesheet" href="/css/themes.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}

        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
            background:var(--bg-primary,#0a0a0b);
            color:var(--text-primary,#fafafa);
            min-height:100vh;
            display:flex;flex-direction:column;
            overflow-x:hidden;
        }

        /* ===== Topbar (统一风格) ===== */
        .topbar{
            display:flex;align-items:center;gap:10px;
            padding:8px 18px;
            background:var(--nav-bg,var(--bg-secondary,#111113));
            border-bottom:1px solid var(--border-color,rgba(255,255,255,0.06));
            min-height:48px;flex-shrink:0;
            backdrop-filter:blur(12px);
            position:sticky;top:0;z-index:50;
        }
        .topbar .brand{
            display:flex;align-items:center;gap:8px;margin-right:auto;
            text-decoration:none;
        }
        .topbar .brand .logo{
            font-size:20px;font-weight:900;
            color:var(--accent-color,#6366f1);
        }
        .topbar .brand .sep{color:var(--text-muted,#71717a);margin:0 2px;font-size:12px}
        .topbar .brand .tool-name{color:var(--text-secondary,#a1a1aa);font-size:13px}
        .topbar .actions{display:flex;align-items:center;gap:8px}
        .topbar button{
            padding:6px 14px;border:1px solid var(--border-color,rgba(255,255,255,0.08));
            border-radius:8px;background:var(--bg-tertiary,#1a1a1e);
            color:var(--text-primary,#fafafa);cursor:pointer;font-size:12px;
            transition:all .15s;font-family:inherit;
        }
        .topbar button:hover{
            background:var(--accent-color,#6366f1);
            border-color:var(--accent-color,#6366f1);
            color:#fff;
        }

        /* ===== 页面主体 ===== */
        .page-content{
            flex:1;max-width:560px;margin:0 auto;width:100%;
            padding:24px 20px 80px;
            display:flex;flex-direction:column;gap:20px;
        }

        /* ===== 卡片通用 ===== */
        .card{
            background:var(--card-bg,#141416);
            border:1px solid var(--card-border,rgba(255,255,255,0.06));
            border-radius:14px;padding:20px;
            transition:border-color .2s;
        }

        /* ===== Hero 区域：环形进度 + 数据 ===== */
        .hero-card{padding:24px;text-align:center}
        .ring-wrap{
            display:flex;justify-content:center;margin-bottom:4px;
        }
        .ring-container{
            position:relative;width:240px;height:240px;
        }
        .ring-svg{width:100%;height:100%;transform:rotate(-90deg)}
        .ring-center{
            position:absolute;top:50%;left:50%;
            transform:translate(-50%,-50%);
            text-align:center;pointer-events:none;
        }
        .ring-money{
            font-size:38px;font-weight:900;
            color:var(--accent-color,#6366f1);
            line-height:1.1;
            transition:color .3s;
        }
        .ring-money.ot{
            color:#f59e0b;
        }
        .ring-label{
            font-size:12px;color:var(--text-muted,#71717a);
            margin-top:2px;
        }
        .ring-time{
            font-size:14px;color:var(--text-secondary,#a1a1aa);
            margin-top:6px;font-family:'JetBrains Mono','Cascadia Code',monospace;
        }
        .ring-status{
            margin-top:8px;font-size:12px;font-weight:600;
            padding:4px 16px;border-radius:20px;display:inline-block;
        }
        .ring-status.idle{
            background:rgba(100,180,255,0.12);color:#64B5F6;
        }
        .ring-status.working{
            background:rgba(99,102,241,0.15);color:var(--accent-light,#a5b4fc);
            animation:pulse-glow 2s ease-in-out infinite;
        }
        .ring-status.overtime{
            background:rgba(245,158,11,0.15);color:#fbbf24;
            animation:pulse-glow 1s ease-in-out infinite;
        }
        .ring-status.done{
            background:rgba(34,197,94,0.12);color:#86efac;
        }

        @keyframes pulse-glow{
            0%,100%{box-shadow:0 0 0 0 rgba(99,102,241,.3)}
            50%{box-shadow:0 0 0 8px rgba(99,102,241,0)}
        }

        /* ===== 统计行 ===== */
        .stats-row{
            display:grid;grid-template-columns:1fr 1fr 1fr;
            gap:10px;margin-top:12px;
        }
        .stat-item{
            background:var(--bg-tertiary,#1a1a1e);
            border-radius:12px;padding:12px 8px;text-align:center;
            border:1px solid var(--border-color,rgba(255,255,255,0.06));
        }
        .stat-label{
            font-size:11px;color:var(--text-muted,#71717a);
            margin-bottom:4px;
        }
        .stat-value{
            font-size:18px;font-weight:700;
            color:var(--text-primary,#fafafa);
        }
        .stat-value.accent{color:var(--accent-color,#6366f1)}
        .stat-value.warn{color:#f59e0b}
        .stat-value.green{color:#4ade80}

        /* ===== 打卡按钮区 ===== */
        .punch-area{
            display:flex;gap:12px;align-items:center;
            flex-direction:column;
        }
        .adjust-row{
            display:flex;align-items:center;gap:8px;
            padding:8px 14px;border-radius:10px;
            background:var(--bg-tertiary,#1a1a1e);
            border:1px solid var(--border-color,rgba(255,255,255,0.06));
            width:100%;
        }
        .adjust-label{
            font-size:12px;color:var(--text-muted,#71717a);
            white-space:nowrap;
        }
        .adjust-input{
            flex:1;background:var(--bg-primary,#0a0a0b);
            border:1px solid var(--border-color,rgba(255,255,255,0.08));
            border-radius:8px;color:var(--text-primary,#fafafa);
            font-size:14px;padding:8px 10px;outline:none;
            font-family:'JetBrains Mono','Cascadia Code',monospace;
            text-align:center;max-width:140px;
        }
        .adjust-input:focus{border-color:var(--accent-color,#6366f1)}
        .adjust-hint{
            font-size:11px;color:var(--text-muted,#71717a);
            white-space:nowrap;
        }
        .punch-btn{
            flex:1;padding:20px 16px;border:none;border-radius:16px;
            font-size:18px;font-weight:800;cursor:pointer;
            font-family:inherit;
            transition:all .2s cubic-bezier(.4,0,.2,1);
            position:relative;overflow:hidden;
            letter-spacing:1px;
        }
        .punch-btn::after{
            content:'';position:absolute;inset:0;
            background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.1));
            pointer-events:none;
        }
        .punch-in{
            background:linear-gradient(135deg,var(--accent-color,#6366f1),#8b5cf6);
            color:#fff;
            box-shadow:0 4px 20px rgba(99,102,241,.35);
        }
        .punch-in:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 30px rgba(99,102,241,.5);
        }
        .punch-in:active{
            transform:scale(.96);
            transition:transform .1s;
        }
        .punch-out{
            background:linear-gradient(135deg,#f59e0b,#ef4444);
            color:#fff;
            box-shadow:0 4px 20px rgba(245,158,11,.3);
        }
        .punch-out:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 30px rgba(245,158,11,.45);
        }
        .punch-out:active{
            transform:scale(.96);
            transition:transform .1s;
        }
        .punch-btn:disabled{
            opacity:.35;pointer-events:none;transform:none !important;
            box-shadow:none !important;
        }

        /* ===== 模式切换 ===== */
        .mode-toggle{
            display:flex;gap:2px;
            background:var(--bg-tertiary,#1a1a1e);
            border-radius:10px;padding:3px;
            border:1px solid var(--border-color,rgba(255,255,255,0.06));
        }
        .mode-toggle button{
            flex:1;padding:8px 14px;border:none;border-radius:8px;
            background:transparent;color:var(--text-muted,#71717a);
            cursor:pointer;font-size:12px;font-weight:600;
            font-family:inherit;transition:all .2s;
        }
        .mode-toggle button.active{
            background:var(--accent-color,#6366f1);
            color:#fff;
        }

        /* ===== 今日工作记录 ===== */
        .session-card{
            background:var(--bg-tertiary,#1a1a1e);
            border-radius:10px;padding:10px 14px;
            border:1px solid var(--border-color,rgba(255,255,255,0.06));
            display:flex;align-items:center;justify-content:space-between;
            margin-bottom:6px;
            font-size:13px;
        }
        .session-time{
            color:var(--text-secondary,#a1a1aa);
            font-family:'JetBrains Mono','Cascadia Code',monospace;
            font-size:12px;
        }
        .session-dur{
            color:var(--accent-color,#6366f1);
            font-weight:700;
        }
        .session-dur.ot{color:#f59e0b}
        .session-ot-tag{
            font-size:10px;padding:2px 8px;border-radius:10px;
            background:rgba(245,158,11,.15);color:#f59e0b;
            margin-left:8px;font-weight:700;
        }

        /* ===== 里程碑 ===== */
        .milestones-grid{
            display:flex;flex-wrap:wrap;gap:8px;
            justify-content:center;
        }
        .ms-card{
            background:var(--bg-tertiary,#1a1a1e);
            border-radius:12px;padding:10px 14px;
            text-align:center;min-width:62px;
            border:1px solid var(--border-color,rgba(255,255,255,0.06));
            transition:all .4s;
        }
        .ms-card.done{
            border-color:var(--accent-color,#6366f1);
            background:rgba(99,102,241,.1);
        }
        .ms-emoji{font-size:18px}
        .ms-label{
            font-size:12px;font-weight:600;
            color:var(--text-muted,#71717a);
        }
        .ms-card.done .ms-label{color:var(--accent-color,#6366f1)}
        .ms-amt{font-size:11px;color:rgba(255,255,255,.2)}
        .ms-card.done .ms-amt{color:var(--accent-light,#a5b4fc)}

        /* ===== 设置面板 ===== */
        .overlay{
            display:none;position:fixed;top:0;left:0;width:100%;height:100%;
            background:rgba(0,0,0,.65);z-index:200;
            justify-content:center;align-items:center;
            backdrop-filter:blur(6px);
        }
        .overlay.active{display:flex}
        .panel{
            background:var(--card-bg,#141416);
            border-radius:20px;padding:28px 24px;
            width:90%;max-width:400px;
            border:1px solid var(--card-border,rgba(255,255,255,0.08));
            box-shadow:0 20px 60px rgba(0,0,0,.5);
            animation:slideUp .3s cubic-bezier(.4,0,.2,1);
        }
        .panel-title{
            color:var(--text-primary,#fafafa);
            font-size:18px;text-align:center;margin-bottom:20px;
            font-weight:700;
        }
        .form-group{margin-bottom:16px}
        .form-label{
            color:var(--text-secondary,#a1a1aa);font-size:12px;
            display:block;margin-bottom:6px;font-weight:500;
        }
        .form-input-wrap{
            display:flex;align-items:center;
            background:var(--bg-tertiary,#1a1a1e);
            border-radius:10px;padding:0 14px;
            border:1px solid var(--border-color,rgba(255,255,255,0.08));
        }
        .form-input-wrap .prefix{
            color:var(--accent-color,#6366f1);font-size:18px;font-weight:700;
        }
        .form-input{
            flex:1;background:none;border:none;color:var(--text-primary,#fafafa);
            font-size:18px;padding:14px 8px;outline:none;font-family:inherit;
        }
        .form-input::placeholder{color:var(--text-muted,#71717a)}
        .form-row{display:flex;gap:12px}
        .form-col{flex:1}
        .form-input-sm{
            width:100%;background:var(--bg-tertiary,#1a1a1e);
            border:1px solid var(--border-color,rgba(255,255,255,0.08));
            border-radius:10px;color:var(--text-primary,#fafafa);
            font-size:14px;padding:12px 10px;outline:none;
            font-family:inherit;box-sizing:border-box;
            text-align:center;
        }
        .form-input-sm:focus,.form-input:focus{
            border-color:var(--accent-color,#6366f1);
        }
        .btn{
            width:100%;padding:14px;margin-top:12px;
            border:none;border-radius:12px;font-size:15px;font-weight:700;
            cursor:pointer;font-family:inherit;
            transition:transform .15s,box-shadow .15s;
        }
        .btn-primary{
            background:linear-gradient(135deg,var(--accent-color,#6366f1),#8b5cf6);
            color:#fff;
            box-shadow:0 4px 16px rgba(99,102,241,.3);
        }
        .btn-primary:hover{
            transform:translateY(-1px);
            box-shadow:0 6px 24px rgba(99,102,241,.45);
        }
        .btn-ghost{
            background:transparent;color:var(--text-muted,#71717a);
            border:1px solid var(--border-color,rgba(255,255,255,0.08));
            font-size:13px;font-weight:400;padding:10px;
        }
        .btn-ghost:hover{
            color:var(--text-primary,#fafafa);
            border-color:var(--text-muted,#71717a);
        }

        /* ===== Toast ===== */
        .toast{
            display:none;position:fixed;top:24px;left:50%;
            transform:translateX(-50%);z-index:300;pointer-events:none;
        }
        .toast.active{display:block}
        .toast-inner{
            background:var(--card-bg,#141416);
            padding:18px 30px;border-radius:16px;
            border:2px solid var(--accent-color,#6366f1);
            box-shadow:0 12px 40px rgba(99,102,241,.25);
            text-align:center;
            animation:bounceIn .5s cubic-bezier(.68,-.55,.265,1.55);
        }
        .toast-emoji{font-size:36px;margin-bottom:4px}
        .toast-title{
            color:var(--text-primary,#fafafa);
            font-size:15px;font-weight:700;
        }
        .toast-sub{color:var(--text-secondary,#a1a1aa);font-size:12px;margin-top:2px}

        /* ===== 金币雨 ===== */
        .coin{
            position:fixed;z-index:250;pointer-events:none;
            animation:coinFall linear forwards;
        }
        @keyframes coinFall{
            0%{opacity:1;transform:translateY(0) rotate(0deg) scale(1)}
            100%{opacity:0;transform:translateY(460px) rotate(720deg) scale(.2)}
        }

        /* ===== 动效 ===== */
        @keyframes bounceIn{
            0%{opacity:0;transform:translateX(-50%) scale(.6) translateY(-20px)}
            70%{transform:translateX(-50%) scale(1.06) translateY(4px)}
            100%{opacity:1;transform:translateX(-50%) scale(1) translateY(0)}
        }
        @keyframes slideUp{
            from{opacity:0;transform:translateY(30px) scale(.96)}
            to{opacity:1;transform:translateY(0) scale(1)}
        }
        @keyframes numberPop{
            0%{transform:scale(1)}
            50%{transform:scale(1.12)}
            100%{transform:scale(1)}
        }
        .num-pop{animation:numberPop .3s ease-out}

        /* ===== 粒子画布 ===== */
        #particlesCanvas{
            position:fixed;top:0;left:0;width:100%;height:100%;
            pointer-events:none;z-index:0;opacity:.4;
        }

        /* ===== 响应式 ===== */
        @media(max-width:420px){
            .page-content{padding:16px 12px 80px}
            .ring-container{width:200px;height:200px}
            .ring-money{font-size:30px}
            .stats-row{gap:6px}
            .stat-value{font-size:16px}
            .punch-btn{font-size:16px;padding:16px 12px}
        }

        /* ===== 主题适配: Anime (粉色系) ===== */
        html.theme-anime .punch-in{
            background:linear-gradient(135deg,#ff6b9d,#ec4899);
            box-shadow:0 4px 20px rgba(255,107,157,.35);
        }
        html.theme-anime .ring-status.working{
            background:rgba(255,107,157,.15);color:#ff6b9d;
        }

        /* ===== 主题适配: Light ===== */
        html.theme-light .overlay{background:rgba(0,0,0,.3)}
        html.theme-light .toast-inner{
            box-shadow:0 12px 40px rgba(99,102,241,.15);
        }
    </style>
</head>
<body>

<canvas id="particlesCanvas"></canvas>

<!-- ===== 顶部导航栏 ===== -->
<div class="topbar">
    <a href="/" class="brand">
        <span class="logo">⚡</span>
        <span class="sep">›</span>
        <span class="tool-name" th:text="${tool.name}">工作日赚钱计时器</span>
    </a>
    <div class="actions">
        <button onclick="toggleSettings()" title="设置">⚙️ 设置</button>
        <button onclick="window.location.href='/'" title="返回首页">🏠 首页</button>
    </div>
</div>

<!-- ===== 页面主体 ===== -->
<div class="page-content">

    <!-- 模式切换 -->
    <div class="mode-toggle" id="modeToggle">
        <button class="active" onclick="switchMode('auto')" id="modeBtnAuto">⏰ 定时模式</button>
        <button onclick="switchMode('manual')" id="modeBtnManual">👆 打卡模式</button>
    </div>

    <!-- 主卡片：进度环 + 数据 -->
    <div class="card hero-card">
        <!-- 环形进度 -->
        <div class="ring-wrap">
            <div class="ring-container">
                <svg class="ring-svg" viewBox="0 0 220 220">
                    <!-- 底色圆环 -->
                    <circle cx="110" cy="110" r="95" fill="none"
                            stroke="var(--border-color,rgba(255,255,255,0.06))" stroke-width="12"/>
                    <!-- 加班圆环 (外圈, 半径更大) -->
                    <circle id="otArc" cx="110" cy="110" r="95" fill="none"
                            stroke="#f59e0b" stroke-width="12"
                            stroke-linecap="round"
                            stroke-dasharray="596.9" stroke-dashoffset="596.9"
                            opacity="0"
                            style="transition: stroke-dashoffset 0.8s cubic-bezier(0.4,0,0.2,1), opacity 0.5s;"/>
                    <!-- 进度圆环 (内圈) -->
                    <defs>
                        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="var(--accent-color,#6366f1)"/>
                            <stop offset="100%" stop-color="#8b5cf6"/>
                        </linearGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="3" result="blur"/>
                            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                        </filter>
                    </defs>
                    <circle id="progressArc" cx="110" cy="110" r="95" fill="none"
                            stroke="url(#ringGrad)" stroke-width="12"
                            stroke-linecap="round" filter="url(#glow)"
                            stroke-dasharray="596.9" stroke-dashoffset="596.9"
                            style="transition: stroke-dashoffset 0.8s cubic-bezier(0.4,0,0.2,1);"/>
                </svg>
                <!-- 中心信息 -->
                <div class="ring-center">
                    <div class="ring-money" id="moneyDisplay">¥0.00</div>
                    <div class="ring-label" id="rateLabel">时薪 --</div>
                    <div class="ring-time" id="timeDisplay">--:--:--</div>
                    <div class="ring-status idle" id="statusBadge">⏳ 等待开始</div>
                </div>
            </div>
        </div>

        <!-- 三列统计 -->
        <div class="stats-row">
            <div class="stat-item">
                <div class="stat-label">💎 时薪</div>
                <div class="stat-value accent" id="hourlyRate">¥0.00</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">🔥 加班费率</div>
                <div class="stat-value warn" id="otRate">-</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">📆 今日目标</div>
                <div class="stat-value green" id="dailyTarget">¥0.00</div>
            </div>
        </div>

        <!-- 本段收入分解 -->
        <div style="margin-top:14px;padding:0 4px">
            <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted,#71717a)">
                <span>基础收入</span><span id="baseEarn">¥0.00</span>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted,#71717a);margin-top:2px">
                <span>加班收入</span><span id="otEarn" style="color:#f59e0b">¥0.00</span>
            </div>
        </div>
    </div>

    <!-- 打卡按钮区（手动模式显示） -->
    <div class="punch-area" id="punchArea" style="display:none;flex-direction:column;gap:8px">
        <div style="display:flex;gap:12px">
            <button class="punch-btn punch-in" id="punchInBtn" onclick="punchIn()">
                👊 打卡上班
            </button>
            <button class="punch-btn punch-out" id="punchOutBtn" onclick="punchOut()" disabled>
                ✋ 打卡下班
            </button>
        </div>
        <div class="adjust-row" id="adjustRow">
            <span class="adjust-label">📝 今日上班时间</span>
            <input class="adjust-input" id="adjustStartInput" type="time" title="调整后从该时间开始计时" onchange="onAdjustStartChange()">
            <span class="adjust-hint" id="adjustHint"></span>
        </div>
    </div>

    <!-- 里程碑 -->
    <div class="card" style="text-align:center">
        <div style="font-size:12px;color:var(--text-muted,#71717a);margin-bottom:10px;font-weight:600">
            🎯 今日里程碑
        </div>
        <div class="milestones-grid" id="milestonesGrid"></div>
    </div>

    <!-- 今日工作记录 -->
    <div class="card" id="sessionLogCard">
        <div style="font-size:12px;color:var(--text-muted,#71717a);margin-bottom:10px;font-weight:600">
            📋 今日打卡记录
        </div>
        <div id="sessionList">
            <div style="text-align:center;color:var(--text-muted,#71717a);font-size:13px;padding:8px">
                😴 今天还没有打卡记录
            </div>
        </div>
        <div style="text-align:right;margin-top:8px;font-size:12px;color:var(--text-muted,#71717a)" id="sessionTotal"></div>
    </div>

</div>

<!-- ===== 设置面板 ===== -->
<div class="overlay" id="overlay" onclick="if(event.target===this)toggleSettings()">
    <div class="panel" onclick="event.stopPropagation()">
        <div class="panel-title">⚙️ 赚钱参数</div>

        <div class="form-group">
            <label class="form-label">💰 月薪（税前）</label>
            <div class="form-input-wrap">
                <span class="prefix">¥</span>
                <input class="form-input" id="salaryInput" type="number" min="0" step="100"
                       placeholder="例如 15000" autocomplete="off">
            </div>
        </div>

        <div class="form-row">
            <div class="form-col">
                <div class="form-group">
                    <label class="form-label">📅 月工作天数</label>
                    <input class="form-input-sm" id="workDaysInput" type="number" min="1" max="31" autocomplete="off">
                </div>
            </div>
            <div class="form-col">
                <div class="form-group">
                    <label class="form-label">⏰ 每日标准工时</label>
                    <div style="display:flex;align-items:center;gap:6px">
                        <input class="form-input-sm" id="dailyHoursInput" type="number" min="1" max="16" step="0.5" style="flex:1" autocomplete="off">
                        <span style="color:var(--text-muted,#71717a);font-size:13px">小时</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-col">
                <div class="form-group">
                    <label class="form-label">🌅 上班时间</label>
                    <input class="form-input-sm" id="startTimeInput" type="time">
                </div>
            </div>
            <div class="form-col">
                <div class="form-group">
                    <label class="form-label">🌇 下班时间</label>
                    <input class="form-input-sm" id="endTimeInput" type="time">
                </div>
            </div>
        </div>

        <div class="form-group" id="breakGroup" style="display:none">
            <label class="form-label">🍱 午休时段（不计入工时）</label>
            <div class="form-row">
                <div class="form-col">
                    <input class="form-input-sm" id="breakStartInput" type="time" placeholder="开始">
                </div>
                <div class="form-col" style="display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:12px">→</div>
                <div class="form-col">
                    <input class="form-input-sm" id="breakEndInput" type="time" placeholder="结束">
                </div>
            </div>
            <div style="font-size:11px;color:var(--text-muted,#71717a);margin-top:4px">
                例如 12:00-13:30，这段时间自动从工时中扣除
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">🔥 加班费率（倍数）</label>
            <div class="form-input-wrap">
                <span class="prefix" style="font-size:14px">×</span>
                <input class="form-input" id="otRateInput" type="number" min="1" max="5" step="0.1"
                       style="font-size:16px" autocomplete="off">
            </div>
            <div style="font-size:11px;color:var(--text-muted,#71717a);margin-top:4px">
                超出标准工时的部分按此倍率计算。默认 1.5 倍
            </div>
        </div>

        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;color:var(--text-muted,#71717a)">
            <input type="checkbox" id="skipWeekendCb" style="accent-color:var(--accent-color,#6366f1);width:16px;height:16px">
            <span>周末自动排除（勾选后周六周日不计时）</span>
        </div>

        <button class="btn btn-primary" onclick="saveSettings()">💾 保存设置</button>
        <button class="btn btn-ghost" onclick="resetSettings()">🔄 恢复默认</button>
    </div>
</div>

<!-- ===== Toast 通知 ===== -->
<div class="toast" id="toast">
    <div class="toast-inner">
        <div class="toast-emoji" id="toastEmoji">🎉</div>
        <div class="toast-title" id="toastTitle"></div>
        <div class="toast-sub" id="toastSub"></div>
    </div>
</div>

<script>
(function(){
    var CIRCLE = 2 * Math.PI * 95;
    var $ = function(id){return document.getElementById(id)};

    // DOM refs
    var moneyDisp = $('moneyDisplay'), timeDisp = $('timeDisplay'), statusBadge = $('statusBadge');
    var rateLabel = $('rateLabel'), progressArc = $('progressArc'), otArc = $('otArc');
    var hourlyRateEl = $('hourlyRate'), otRateEl = $('otRate'), dailyTargetEl = $('dailyTarget');
    var baseEarnEl = $('baseEarn'), otEarnEl = $('otEarn');
    var milestonesGrid = $('milestonesGrid'), sessionList = $('sessionList'), sessionTotal = $('sessionTotal');
    var toast = $('toast'), toastEmoji = $('toastEmoji'), toastTitle = $('toastTitle'), toastSub = $('toastSub');
    var punchArea = $('punchArea');
    var adjustStartInp = $('adjustStartInput'), adjustHint = $('adjustHint');

    // Settings inputs
    var salaryInp = $('salaryInput'), workDaysInp = $('workDaysInput'), dailyHoursInp = $('dailyHoursInput');
    var startTimeInp = $('startTimeInput'), endTimeInp = $('endTimeInput');
    var otRateInp = $('otRateInput'), skipWeekendCb = $('skipWeekendCb');
    var breakStartInp = $('breakStartInput'), breakEndInp = $('breakEndInput');

    // ============ 计算用状态 ============
    var hourlyRate = 0, dailySalary = 0, dailyHours = 8, otMultiplier = 1.5;
    var totalWorkMin = 480, workStartMin = 540, workEndMin = 1080;
    var breakStartMin = -1, breakEndMin = -1;   // -1 = noon break disabled
    var lastToastTime = 0, curPct = 0;

    // ============ 持久化状态 ============
    function loadState() {
        try { return JSON.parse(localStorage.getItem('wm2_state')) || {}; } catch(e) { return {}; }
    }
    function saveState(s) { localStorage.setItem('wm2_state', JSON.stringify(s)); }

    function loadSessions() {
        try { return JSON.parse(localStorage.getItem('wm2_sessions')) || []; } catch(e) { return []; }
    }
    function saveSessionsToStorage(arr) { localStorage.setItem('wm2_sessions', JSON.stringify(arr)); }

    function loadConfig() {
        try { return JSON.parse(localStorage.getItem('wm2_config')) || {}; } catch(e) { return {}; }
    }
    function saveConfigToStorage() { localStorage.setItem('wm2_config', JSON.stringify(config)); }

    // ============ 全局数据 ============
    var config = loadConfig();
    var mode = config.mode || 'auto';
    var clockedIn = false;
    var clockInTime = 0;          // timestamp
    var clockInBaseH = 0;         // accumulated hours before current punch-in (today)
    var punchStartMin = 0;        // effective clock-in time in minutes (today)
    var sessions = loadSessions();
    var achievedMs = {};

    // ============ 初始化：恢复打卡状态（核心修复） ============
    function recoverState() {
        var s = loadState();
        var today = new Date().toDateString();

        // 每日里程碑
        var savedMs = JSON.parse(localStorage.getItem('wm2_milestones') || '{}');
        var msDate = localStorage.getItem('wm2_last_date');
        if (msDate === today) {
            achievedMs = savedMs;
        } else {
            achievedMs = {};
            localStorage.setItem('wm2_milestones', '{}');
            localStorage.setItem('wm2_last_date', today);
        }

        // 恢复上班时间调整
        if (s.punchStartMin && s.punchStartMin > 0) {
            punchStartMin = s.punchStartMin;
        } else {
            punchStartMin = workStartMin > 0 ? workStartMin : 540; // fallback to 09:00
        }

        // 跨夜 session 清理：昨日进行中的 session 自动结算到今晨 00:00
        sessions.forEach(function(s) {
            if (!s.end && new Date(s.start).toDateString() !== today) {
                // 昨天没下班，自动算到今天 00:00
                s.end = new Date(today + ' 00:00:00').getTime();
                s.autoClosed = true;
            }
        });

        // 检查今天是否有进行中的 session
        var hasActive = false;
        sessions.forEach(function(s) {
            if (!s.end && new Date(s.start).toDateString() === today) {
                hasActive = true;
                clockedIn = true;
                clockInTime = s.start;
                clockInBaseH = 0;
                // 计算之前的累计
                sessions.forEach(function(s2) {
                    if (s2.end && new Date(s2.start).toDateString() === today && s2 !== s) {
                        clockInBaseH += (s2.end - s2.start) / 3600000;
                    }
                });
            }
        });

        // 如果 localStorage state 与 session 不一致，以 session 为准
        if (s.clockedIn && !hasActive) {
            clockedIn = false; clockInTime = 0; clockInBaseH = 0;
            saveCurrentState();
        }
        if (hasActive && !s.clockedIn) {
            saveCurrentState();
        }
    }

    function saveCurrentState() {
        saveState({ clockedIn: clockedIn, clockInTime: clockInTime, clockInBaseH: clockInBaseH, punchStartMin: punchStartMin });
    }

    // ============ 配置管理 ============
    function applyConfig() {
        config = loadConfig();
        if (!config.workDays) config.workDays = 22;
        if (!config.dailyHours) config.dailyHours = 8;
        if (!config.startTime) config.startTime = '09:00';
        if (!config.endTime) config.endTime = '18:00';
        if (config.otMultiplier === undefined) config.otMultiplier = 1.5;
        if (config.skipWeekend === undefined) config.skipWeekend = false;
        if (!config.mode) config.mode = 'auto';
        if (!config.breakStart) config.breakStart = '';
        if (!config.breakEnd) config.breakEnd = '';

        mode = config.mode;
        otMultiplier = config.otMultiplier;
        dailyHours = config.dailyHours;

        salaryInp.value = config.salary || '';
        workDaysInp.value = config.workDays;
        dailyHoursInp.value = config.dailyHours;
        startTimeInp.value = config.startTime;
        endTimeInp.value = config.endTime;
        otRateInp.value = config.otMultiplier;
        skipWeekendCb.checked = config.skipWeekend;
        breakStartInp.value = config.breakStart || '';
        breakEndInp.value = config.breakEnd || '';

        // 午休不填时隐藏
        $('breakGroup').style.display = (config.breakStart && config.breakEnd) ? 'block' : 'none';

        // 解析时间
        var sp = config.startTime.split(':');
        workStartMin = parseInt(sp[0]) * 60 + parseInt(sp[1]);
        var ep = config.endTime.split(':');
        workEndMin = parseInt(ep[0]) * 60 + parseInt(ep[1]);

        // 午休扣除
        breakStartMin = -1; breakEndMin = -1;
        if (config.breakStart && config.breakEnd) {
            var bsp = config.breakStart.split(':'), bep = config.breakEnd.split(':');
            breakStartMin = parseInt(bsp[0]) * 60 + parseInt(bsp[1]);
            breakEndMin = parseInt(bep[0]) * 60 + parseInt(bep[1]);
        }

        // 净工作时间 = 上下班间隔 - 午休
        var rawWorkMin = workEndMin - workStartMin;
        if (rawWorkMin <= 0) rawWorkMin = Math.round(dailyHours * 60); // 夜班 fallback
        var breakMin = (breakStartMin >= 0 && breakEndMin >= 0) ? (breakEndMin - breakStartMin) : 0;
        totalWorkMin = Math.max(rawWorkMin - breakMin, 0);
        // 如果用户没改过 dailyHours，自动对齐为净工作时间
        if (!config._dailyHoursSet) {
            dailyHours = Math.round(totalWorkMin / 6) / 10; // 精确到 0.1h
            dailyHoursInp.value = dailyHours;
        }

        // 费率
        if (config.salary > 0 && config.workDays > 0 && dailyHours > 0) {
            dailySalary = config.salary / config.workDays;
            hourlyRate = dailySalary / dailyHours;
        } else {
            dailySalary = 0; hourlyRate = 0;
        }

        hourlyRateEl.textContent = '¥' + hourlyRate.toFixed(2);
        otRateEl.textContent = '×' + otMultiplier.toFixed(1) + ' ¥' + (hourlyRate * otMultiplier).toFixed(2);
        dailyTargetEl.textContent = '¥' + dailySalary.toFixed(2);
        rateLabel.textContent = '时薪 ¥' + hourlyRate.toFixed(2);

        buildMilestones();
        updateUIMode();
        updateSessionList();
        initPunchStartMin();
    }

    // ============ 上班时间调整 ============
    function initPunchStartMin() {
        // 默认用配置的上班时间
        if (!punchStartMin || punchStartMin <= 0) {
            punchStartMin = workStartMin;
        }
        syncAdjustInput();
    }

    function syncAdjustInput() {
        var hh = fmt2(Math.floor(punchStartMin / 60));
        var mm = fmt2(punchStartMin % 60);
        adjustStartInp.value = hh + ':' + mm;
        updateAdjustHint();
    }

    function updateAdjustHint() {
        var now = new Date();
        var curMin = now.getHours() * 60 + now.getMinutes();
        if (punchStartMin < curMin) {
            var late = curMin - punchStartMin;
            var h = Math.floor(late / 60), m = late % 60;
            if (clockedIn) {
                adjustHint.textContent = '(已补签 ' + (h>0?h+'h':'') + m + 'min)';
            } else {
                adjustHint.textContent = '(距当前 ' + (h>0?h+'h':'') + m + 'min)';
            }
        } else if (punchStartMin === curMin) {
            adjustHint.textContent = '(= 当前时间)';
        } else {
            adjustHint.textContent = '';
        }
    }

    function getPunchTimestamp() {
        var now = new Date();
        var today = now.toDateString();
        var ts = new Date(today + ' ' + fmt2(Math.floor(punchStartMin / 60)) + ':' + fmt2(punchStartMin % 60) + ':00').getTime();
        // 如果目标时间在未来，用当前时间
        if (ts > Date.now()) {
            var curMin = now.getHours() * 60 + now.getMinutes();
            ts = new Date(today + ' ' + fmt2(Math.floor(curMin / 60)) + ':' + fmt2(curMin % 60) + ':00').getTime();
        }
        return ts;
    }

    function onAdjustStartChange() {
        var v = adjustStartInp.value;
        if (!v) return;
        var parts = v.split(':');
        var newMin = parseInt(parts[0]) * 60 + parseInt(parts[1]);
        if (isNaN(newMin)) return;
        var oldMin = punchStartMin;
        punchStartMin = newMin;

        // 如果已打卡，更新 session 的 start 时间
        if (clockedIn) {
            clockInTime = getPunchTimestamp();
            saveCurrentState();
            // 更新对应 session 的 start
            var today = new Date().toDateString();
            for (var i = sessions.length - 1; i >= 0; i--) {
                var s = sessions[i];
                if (!s.end && new Date(s.start).toDateString() === today) {
                    s.start = clockInTime;
                    break;
                }
            }
            saveSessionsToStorage(sessions);
            updateSessionList();
        } else {
            saveCurrentState();
        }
        updateAdjustHint();
        update();
    }

    window.onAdjustStartChange = onAdjustStartChange;

    // ============ 获取扣除午休后的实动工时 ============
    function getEffectiveMinutes(curMin) {
        // curMin: minutes from midnight
        if (breakStartMin < 0 || breakEndMin < 0) return curMin;
        if (curMin <= breakStartMin) return curMin;
        if (curMin >= breakEndMin) return curMin - (breakEndMin - breakStartMin);
        // 在午休中 → 停在午休开始
        return breakStartMin;
    }

    function getEffectiveWorkMinutes(curMin) {
        if (curMin < workStartMin) return 0;
        var effective = getEffectiveMinutes(curMin);
        var effectiveStart = getEffectiveMinutes(workStartMin);
        return Math.max(0, effective - effectiveStart);
    }

    // ============ 模式切换 ============
    function switchMode(m) {
        mode = m;
        config.mode = m;
        saveConfigToStorage();
        updateUIMode();
        if (m === 'auto' && clockedIn) punchOut(true);
        update();
    }
    window.switchMode = switchMode;

    function updateUIMode() {
        var isManual = (mode === 'manual');
        punchArea.style.display = isManual ? 'flex' : 'none';
        $('modeBtnAuto').classList.toggle('active', !isManual);
        $('modeBtnManual').classList.toggle('active', isManual);
    }

    // ============ 当日累计工时（基于 sessions，含进行中） ============
    function getTodayAccumulatedHours() {
        var total = 0, today = new Date().toDateString();
        sessions.forEach(function(s) {
            if (new Date(s.start).toDateString() === today) {
                var dur = (s.end || Date.now()) - s.start;
                total += dur / 3600000;
            }
        });
        return total;
    }

    function getTodayCompletedHours() {
        var total = 0, today = new Date().toDateString();
        sessions.forEach(function(s) {
            if (new Date(s.start).toDateString() === today && s.end) {
                total += (s.end - s.start) / 3600000;
            }
        });
        return total;
    }

    function cleanOldSessions() {
        var cutoff = Date.now() - 30 * 24 * 3600 * 1000; // 保留30天
        sessions = sessions.filter(function(s) { return s.start > cutoff; });
        saveSessionsToStorage(sessions);
    }

    // ============ 打卡 ============
    function punchIn() {
        if (clockedIn) return;
        if (config.skipWeekend && isWeekend()) {
            showToast('🏖️', '周末休息', '周末不打卡，好好享受吧~');
            return;
        }
        clockedIn = true;
        // ★ 使用可调整的上班时间，而非当前时间
        clockInTime = getPunchTimestamp();
        clockInBaseH = getTodayCompletedHours();
        saveCurrentState();

        sessions.push({ start: clockInTime, end: 0, note: '手动打卡' });
        saveSessionsToStorage(sessions);

        updatePunchButtons();
        updateSessionList();
        var startStr = new Date(clockInTime).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        showToast('👊', '打卡上班！',
            startStr + ' 开始搬砖 💪' + (punchStartMin !== workStartMin ? ' (已调整上班时间)' : ''));
        update();
    }
    window.punchIn = punchIn;

    function punchOut(silent) {
        if (!clockedIn) return;
        var now = Date.now();
        var elapsedH = (now - clockInTime) / 3600000;

        clockedIn = false;
        saveCurrentState();

        // 更新 session
        if (sessions.length > 0) {
            var last = sessions[sessions.length - 1];
            last.end = now;
            last.duration = elapsedH;
        }
        saveSessionsToStorage(sessions);

        updatePunchButtons();
        updateSessionList();

        if (!silent) {
            // ★ 核心修复：基于当日累计计算基础/加班工时
            var totalAccH = getTodayCompletedHours();
            var baseH = Math.min(totalAccH, dailyHours);
            var prevBase = Math.min(totalAccH - elapsedH, dailyHours);
            var thisBase = Math.max(0, baseH - prevBase);
            var thisOT = Math.max(0, elapsedH - thisBase);
            var earnings = thisBase * hourlyRate + thisOT * hourlyRate * otMultiplier;

            var msg = '本段 ¥' + earnings.toFixed(2) + ' · ' + formatHours(elapsedH);
            if (thisOT > 0.01) msg += ' (含加班 ' + formatHours(thisOT) + ')';
            showToast('🏠', '打卡下班！', msg);
            spawnCoins();
        }
        clockInTime = 0; clockInBaseH = 0;
        // 下班后重置上班时间为默认值
        punchStartMin = workStartMin;
        syncAdjustInput();
        update();
    }
    window.punchOut = punchOut;

    function updatePunchButtons() {
        var inBtn = $('punchInBtn'), outBtn = $('punchOutBtn');
        if (clockedIn) {
            inBtn.disabled = true; inBtn.textContent = '🟢 工作中...';
            outBtn.disabled = false;
        } else {
            inBtn.disabled = false; inBtn.textContent = '👊 打卡上班';
            outBtn.disabled = true;
            // 下班后重新初始化上班时间
            if (!clockedIn) { initPunchStartMin(); }
        }
        updateAdjustHint();
    }

    // ============ Session 列表 ============
    function updateSessionList() {
        var today = new Date().toDateString();
        var todaySessions = sessions.filter(function(s) {
            return new Date(s.start).toDateString() === today;
        });

        if (todaySessions.length === 0) {
            // 已下班但无打卡记录的文案
            if (getTodayCompletedHours() > 0.01) {
                sessionList.innerHTML = '<div style="text-align:center;color:var(--text-secondary,#a1a1aa);font-size:13px;padding:8px">📋 今日已累计工作，但无打卡记录（可能在定时模式）</div>';
            } else {
                sessionList.innerHTML = '<div style="text-align:center;color:var(--text-muted,#71717a);font-size:13px;padding:8px">😴 今天还没有打卡记录</div>';
            }
            sessionTotal.textContent = '';
            return;
        }

        var totalH = 0, totalEarn = 0, totalOtH = 0;
        var html = '';
        todaySessions.forEach(function(s, idx) {
            var startStr = new Date(s.start).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            var endStr = s.end ? new Date(s.end).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '进行中';
            if (s.autoClosed) endStr = '自动结算';

            var durH = s.end ? (s.end - s.start) / 3600000 : (Date.now() - s.start) / 3600000;
            totalH += durH;

            // ★ 累计计算加班
            var accBefore = 0;
            for (var i = 0; i < idx; i++) {
                var prev = todaySessions[i];
                if (prev.end) accBefore += (prev.end - prev.start) / 3600000;
            }
            var thisBase = Math.max(0, Math.min(durH, dailyHours - accBefore));
            var thisOT = Math.max(0, durH - thisBase);
            var earn = thisBase * hourlyRate + thisOT * hourlyRate * otMultiplier;
            totalEarn += earn;
            totalOtH += thisOT;

            var otTag = thisOT > 0.01 ? '<span class="session-ot-tag">加班 +' + formatHours(thisOT) + '</span>' : '';
            html += '<div class="session-card">' +
                '<span class="session-time">' + startStr + ' → ' + endStr + '</span>' +
                '<span><span class="session-dur' + (thisOT > 0.01 ? ' ot' : '') + '">' + formatHours(durH) + '</span>' + otTag + '</span>' +
                '</div>';
        });
        sessionList.innerHTML = html;
        sessionTotal.textContent = '🏁 累计：' + formatHours(totalH) + ' · ¥' + totalEarn.toFixed(2) +
            (totalOtH > 0 ? ' | 🔥 加班 ' + formatHours(totalOtH) : '');
    }

    function formatHours(h) {
        var hr = Math.floor(h), mn = Math.round((h - hr) * 60);
        return hr + 'h' + String(mn).padStart(2, '0') + 'm';
    }

    // ============ 设置面板 ============
    function toggleSettings() {
        var ov = $('overlay');
        if (ov.classList.contains('active')) {
            ov.classList.remove('active');
        } else {
            applyConfig();
            ov.classList.add('active');
            setTimeout(function() { salaryInp.focus(); }, 100);
        }
    }
    window.toggleSettings = toggleSettings;

    function saveSettings() {
        config.salary = parseFloat(salaryInp.value) || 0;
        config.workDays = parseInt(workDaysInp.value) || 22;
        config.dailyHours = parseFloat(dailyHoursInp.value) || 8;
        config.startTime = startTimeInp.value || '09:00';
        config.endTime = endTimeInp.value || '18:00';
        config.otMultiplier = parseFloat(otRateInp.value) || 1.5;
        config.skipWeekend = skipWeekendCb.checked;
        config.breakStart = breakStartInp.value || '';
        config.breakEnd = breakEndInp.value || '';
        config._dailyHoursSet = true;
        saveConfigToStorage();

        // 周末跳过 + 打卡中 → 终止
        if (config.skipWeekend && isWeekend() && clockedIn && mode === 'manual') {
            punchOut(true);
        }

        applyConfig();
        toggleSettings();
        update();
        if (config.salary > 0) {
            var msg = '时薪 ¥' + hourlyRate.toFixed(2) + ' · 日薪 ¥' + dailySalary.toFixed(2);
            if (breakStartMin >= 0) msg += ' · 午休 ' + config.breakStart + '-' + config.breakEnd;
            showToast('✅', '设置已保存', msg);
        }
    }
    window.saveSettings = saveSettings;

    function resetSettings() {
        config = { salary: 0, workDays: 22, dailyHours: 8, startTime: '09:00', endTime: '18:00',
            otMultiplier: 1.5, skipWeekend: false, mode: 'auto', breakStart: '', breakEnd: '' };
        saveConfigToStorage();
        achievedMs = {};
        localStorage.setItem('wm2_milestones', '{}');
        clockedIn = false; clockInTime = 0; clockInBaseH = 0; punchStartMin = 0;
        saveCurrentState();
        applyConfig();
        toggleSettings();
        update();
    }
    window.resetSettings = resetSettings;

    // ============ 里程碑 ============
    function buildMilestones() {
        if (dailySalary <= 0) {
            milestonesGrid.innerHTML = '<span style="color:var(--text-muted,#71717a);font-size:13px">⏳ 设置月薪后显示里程碑</span>';
            return;
        }
        var items = [
            { label: '早餐', pct: 10, emoji: '🥐' },
            { label: '午餐', pct: 35, emoji: '🍱' },
            { label: '下午茶', pct: 60, emoji: '🧋' },
            { label: '晚餐', pct: 85, emoji: '🍲' },
            { label: '收工!', pct: 100, emoji: '🎊' },
            { label: '加班1h', pct: 112.5, emoji: '💪' },
            { label: '加班2h', pct: 125, emoji: '🔥' },
        ];
        milestonesGrid.innerHTML = items.map(function(m) {
            var amt = (dailySalary * m.pct / 100).toFixed(0);
            return '<div class="ms-card' + (achievedMs[m.label] ? ' done' : '') + '">' +
                '<div class="ms-emoji">' + m.emoji + '</div>' +
                '<div class="ms-label">' + m.label + '</div>' +
                '<div class="ms-amt">¥' + amt + '</div></div>';
        }).join('');
    }

    function checkMilestones(pct) {
        if (dailySalary <= 0) return;
        var items = [
            { label: '早餐', pct: 10, emoji: '🥐', msg: '赚够早餐钱！精神满满 ☀️' },
            { label: '午餐', pct: 35, emoji: '🍱', msg: '午饭钱已到账，好好犒劳自己~' },
            { label: '下午茶', pct: 60, emoji: '🧋', msg: '来杯奶茶续命吧！' },
            { label: '晚餐', pct: 85, emoji: '🍲', msg: '晚饭有着落了 🍲' },
            { label: '收工!', pct: 99.5, emoji: '🎊', msg: '今天日薪已全额到手，辛苦啦！' },
            { label: '加班1h', pct: 111, emoji: '💪', msg: '加班 1 小时，加倍赚钱中 🔥' },
            { label: '加班2h', pct: 124, emoji: '🔥', msg: '加班 2 小时！战斗到最后一刻！' },
        ];
        items.forEach(function(m) {
            if (pct >= m.pct && !achievedMs[m.label]) {
                achievedMs[m.label] = true;
                localStorage.setItem('wm2_milestones', JSON.stringify(achievedMs));
                showToast(m.emoji, '✨ ' + m.label, m.msg);
                buildMilestones();
                spawnCoins();
            }
        });
    }

    // ============ Toast ============
    function showToast(emoji, title, sub) {
        var now = Date.now();
        if (now - lastToastTime < 2000) return;
        lastToastTime = now;
        toastEmoji.textContent = emoji;
        toastTitle.textContent = title;
        toastSub.textContent = sub || '';
        toast.classList.add('active');
        setTimeout(function() { toast.classList.remove('active'); }, 3000);
    }

    // ============ 金币雨 ============
    function spawnCoins() {
        var icons = ['🪙', '💰', '💎', '✨', '💵', '🪙', '🌟', '💸'];
        for (var i = 0; i < 35; i++) {
            var coin = document.createElement('div');
            coin.className = 'coin';
            coin.textContent = icons[Math.floor(Math.random() * icons.length)];
            coin.style.cssText =
                'font-size:' + (16 + Math.random() * 22) + 'px;' +
                'left:' + (25 + Math.random() * 50) + '%;' +
                'top:' + (10 + Math.random() * 40) + '%;' +
                'animation-duration:' + (1.2 + Math.random() * 2.5) + 's;' +
                'animation-delay:' + (Math.random() * 0.5) + 's;';
            document.body.appendChild(coin);
            setTimeout(function() { if (coin.parentNode) coin.parentNode.removeChild(coin); }, 4000);
        }
    }

    // ============ 工具函数 ============
    function isWeekend() { var d = new Date().getDay(); return d === 0 || d === 6; }
    function fmt2(n) { return String(Math.floor(n)).padStart(2, '0'); }

    // ============ 核心更新 ============
    function update() {
        var now = new Date();
        var curMin = now.getHours() * 60 + now.getMinutes();
        var curDate = now.toDateString();
        var elapsedH = 0, earned = 0, pct = 0;
        var isOT = false, otHours = 0, baseEarn = 0, otEarn = 0;
        var statusText = '', statusClass = '';

        // 每日重置（只清当天数据）
        var lastDate = localStorage.getItem('wm2_last_date');
        if (lastDate !== curDate) {
            achievedMs = {};
            localStorage.setItem('wm2_milestones', '{}');
            localStorage.setItem('wm2_last_date', curDate);
            // ★ 修复：不清空 sessions，只清当日里程碑
            buildMilestones();
            updateSessionList();
        }

        // --- 手动打卡模式 ---
        if (mode === 'manual') {
            if (clockedIn) {
                elapsedH = (Date.now() - clockInTime) / 3600000;
                var totalH = clockInBaseH + elapsedH;
                var baseH = Math.min(totalH, dailyHours);
                otHours = Math.max(0, totalH - dailyHours);
                isOT = otHours > 0.01;

                baseEarn = baseH * hourlyRate;
                otEarn = otHours * hourlyRate * otMultiplier;
                earned = baseEarn + otEarn;
                pct = dailySalary > 0 ? Math.min((earned / dailySalary) * 100, 200) : 0;

                statusText = isOT ? '🔥 加班中 · 本段 ' + formatTimeHM(elapsedH) :
                    '👊 搬砖中 · 已打卡 ' + formatTimeHM(elapsedH);
                statusClass = isOT ? 'overtime' : 'working';
            } else {
                var completedH = getTodayCompletedHours();
                if (completedH > 0.005) {
                    var totBase = Math.min(completedH, dailyHours);
                    var totOT = Math.max(0, completedH - dailyHours);
                    baseEarn = totBase * hourlyRate;
                    otEarn = totOT * hourlyRate * otMultiplier;
                    earned = baseEarn + otEarn;
                    pct = dailySalary > 0 ? Math.min((completedH / dailyHours) * 100, 200) : 0;
                    statusText = '🏠 已下班 · 今累 ' + formatHours(completedH) + (totOT > 0.01 ? ' | 🔥 +' + formatHours(totOT) : '');
                    statusClass = completedH > dailyHours ? 'overtime' : 'done';
                } else {
                    statusText = '⏳ 点击「👊 打卡上班」开始计时';
                    statusClass = 'idle';
                }
            }
        }
        // --- 自动定时模式 ---
        else {
            if (config.skipWeekend && isWeekend()) {
                moneyDisp.textContent = '¥0.00';
                timeDisp.textContent = '--:--:--';
                statusBadge.textContent = '🏖️ 周末休息';
                statusBadge.className = 'ring-status idle';
                progressArc.style.strokeDashoffset = CIRCLE;
                otArc.style.opacity = '0';
                baseEarnEl.textContent = '¥0.00'; otEarnEl.textContent = '¥0.00';
                setTabTitle(0);
                return;
            }

            // 等待上班
            if (curMin < workStartMin) {
                var remain = workStartMin - curMin;
                moneyDisp.textContent = '¥0.00';
                timeDisp.textContent = '--:--:--';
                statusText = '⏳ 距上班 ' + Math.floor(remain / 60) + '时' + (remain % 60) + '分';
                statusClass = 'idle';
                pct = 0;
                elapsedH = 0;
            }
            // 工作中
            else if (curMin < workEndMin) {
                // ★ 使用扣除午休后的有效工时
                var effMin = getEffectiveWorkMinutes(curMin);
                elapsedH = effMin / 60;

                var baseH = Math.min(elapsedH, dailyHours);
                otHours = Math.max(0, elapsedH - dailyHours);
                isOT = otHours > 0.01;

                baseEarn = baseH * hourlyRate;
                otEarn = otHours * hourlyRate * otMultiplier;
                earned = baseEarn + otEarn;
                pct = dailyHours > 0 ? Math.min((elapsedH / dailyHours) * 100, 200) : 0;

                var remainMin = workEndMin - curMin;
                // 如果当前在午休中
                if (breakStartMin >= 0 && curMin >= breakStartMin && curMin < breakEndMin) {
                    statusText = '🍱 午休中 · ' + Math.floor((breakEndMin - curMin) / 60) + '时' + ((breakEndMin - curMin) % 60) + '分后继续';
                    statusClass = 'idle';
                } else {
                    statusText = isOT ? '🔥 加班中 · 距下班 ' + formatTimeH(remainMin) :
                        '💼 打工中 · 距下班 ' + formatTimeH(remainMin);
                    statusClass = isOT ? 'overtime' : 'working';
                }
            }
            // 已下班，加班继续累积
            else {
                var workedMin = getEffectiveWorkMinutes(workEndMin);
                elapsedH = workedMin / 60;
                var overMin = curMin - workEndMin;
                // 跨午夜处理
                if (curMin < workStartMin) {
                    // 过了午夜，加班 = 昨天剩余 + 今天凌晨
                    overMin = (24 * 60 - workEndMin) + curMin;
                }
                otHours = overMin / 60;

                baseEarn = Math.min(elapsedH, dailyHours) * hourlyRate;
                otEarn = otHours * hourlyRate * otMultiplier;
                earned = baseEarn + otEarn;
                isOT = otHours > 0.01;
                pct = dailyHours > 0 ? Math.min(((elapsedH + otHours) / dailyHours) * 100, 250) : 100;

                statusText = '🏠 已下班' + (otHours > 0.01 ? ' · 加班 ' + formatHours(otHours) + ' 持续累积' : '');
                statusClass = isOT ? 'overtime' : 'done';
            }
        }

        // --- 统一渲染 ---
        curPct = pct;
        moneyDisp.textContent = '¥' + (earned > 0 ? earned.toFixed(2) : '0.00');
        moneyDisp.classList.toggle('ot', isOT);

        if (elapsedH > 0) {
            var h = Math.floor(elapsedH), m = Math.floor((elapsedH - h) * 60), s = now.getSeconds();
            timeDisp.textContent = fmt2(h) + ':' + fmt2(m) + ':' + fmt2(s);
        } else if (statusClass === 'done' && mode === 'manual') {
            var ah = getTodayCompletedHours();
            timeDisp.textContent = fmt2(ah) + ':' + fmt2((ah - Math.floor(ah)) * 60) + ':00';
        } else {
            timeDisp.textContent = '--:--:--';
        }

        statusBadge.textContent = statusText;
        statusBadge.className = 'ring-status ' + statusClass;

        var offset = CIRCLE * (1 - Math.min(pct, 200) / 100);
        progressArc.style.strokeDashoffset = offset;

        if (isOT && otHours > 0.01) {
            otArc.style.opacity = '0.7';
            var otPct = Math.min((otHours / dailyHours) * 100, 80);
            otArc.style.strokeDashoffset = CIRCLE * (1 - otPct / 100);
        } else {
            otArc.style.opacity = '0';
        }

        baseEarnEl.textContent = '¥' + baseEarn.toFixed(2);
        otEarnEl.textContent = '¥' + otEarn.toFixed(2);
        if (otEarn > 0.005) {
            otEarnEl.style.color = '#f59e0b';
            otEarnEl.style.fontWeight = '700';
        } else {
            otEarnEl.style.color = 'var(--text-muted,#71717a)';
            otEarnEl.style.fontWeight = '400';
        }

        checkMilestones(pct);

        if (mode === 'manual' && clockedIn) {
            updateSessionList();
        }

        // ★ Tab 标题实时收入
        setTabTitle(earned);
    }

    var titleTimer = 0;
    var originalTitle = document.title;
    function setTabTitle(earned) {
        clearTimeout(titleTimer);
        if (earned > 0.005 && (mode === 'manual' ? clockedIn : true)) {
            document.title = '¥' + earned.toFixed(2) + ' · ' + originalTitle;
        } else {
            document.title = originalTitle;
        }
        // 恢复标题（停顿 5 秒后回原）
        titleTimer = setTimeout(function() {
            if (!clockedIn) document.title = originalTitle;
        }, 5000);
    }

    function formatTimeHM(hours) {
        var h = Math.floor(hours), m = Math.round((hours - h) * 60);
        return h + 'h' + String(m).padStart(2, '0') + 'm';
    }
    function formatTimeH(minutes) {
        var h = Math.floor(minutes / 60), m = minutes % 60;
        return (h > 0 ? h + '时' : '') + m + '分';
    }

    // ============ 粒子背景 ============
    function initParticles() {
        var canvas = document.getElementById('particlesCanvas');
        var ctx = canvas.getContext('2d');
        var parts = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resize(); window.addEventListener('resize', resize);
        var accentRGB = '99,102,241';
        for (var i = 0; i < 36; i++) {
            parts.push({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                r: 1.5 + Math.random() * 2.5,
                vx: (Math.random() - .5) * .3,
                vy: -.2 - Math.random() * .4,
                alpha: .08 + Math.random() * .18,
                color: Math.random() > .65 ? accentRGB : '255,255,255'
            });
        }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            parts.forEach(function(p) {
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(' + p.color + ',' + p.alpha + ')';
                ctx.fill();
                p.x += p.vx; p.y += p.vy;
                if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
                if (p.x < -10 || p.x > canvas.width + 10) p.x = p.x < 0 ? canvas.width + 10 : -10;
            });
            requestAnimationFrame(draw);
        }
        draw();
    }

    // ============ 快捷键 ============
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && $('overlay').classList.contains('active')) {
            toggleSettings();
        }
        if (e.key === ' ' && mode === 'manual' && !$('overlay').classList.contains('active')) {
            e.preventDefault();
            if (clockedIn) punchOut(); else punchIn();
        }
    });

    // ============ 监听 storage 事件（多标签页同步） ============
    window.addEventListener('storage', function(e) {
        if (e.key === 'wm2_sessions') {
            sessions = loadSessions();
            updateSessionList();
        }
        if (e.key === 'wm2_state') {
            var s = loadState();
            if (s.clockedIn !== clockedIn) {
                clockedIn = s.clockedIn;
                clockInTime = s.clockInTime || 0;
                clockInBaseH = s.clockInBaseH || 0;
                punchStartMin = s.punchStartMin || workStartMin;
                syncAdjustInput();
                updatePunchButtons();
                update();
            }
        }
    });

    // ============ 暴露全局 ============
    window.toggleSettings = toggleSettings;
    window.saveSettings = saveSettings;
    window.resetSettings = resetSettings;
    window.punchIn = punchIn;
    window.punchOut = punchOut;
    window.switchMode = switchMode;

    // ============ 启动 ============
    recoverState();
    applyConfig();
    updateUIMode();
    updatePunchButtons();
    updateSessionList();
    update();
    setInterval(update, 1000);
    initParticles();

    // 首次使用自动打开设置
    if (!config.salary || config.salary === 0) {
        setTimeout(function() {
            $('overlay').classList.add('active');
            salaryInp.focus();
        }, 500);
    }
})();
</script>
