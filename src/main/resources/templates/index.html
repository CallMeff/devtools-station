<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="home.page_title">DevTools Station - 开发者在线工具箱</title>
    <meta name="description" data-i18n-content="home.meta_desc" content="一站式开发者在线工具箱，提供加解密、格式化、转换、生成等40+开发常用工具">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="app-password-min-length" th:content="${passwordMinLength}">
    <meta name="all-tools-data" th:content="${allToolsJson}">
    <meta name="categories-data" th:content="${categoriesJson}">
    <!-- 防闪烁：在 CSS 加载前立即应用保存的主题 -->
    <script>(function(){var t=localStorage.getItem('devtools-theme');if(t){document.documentElement.className='theme-'+t;}})()</script>
    <link rel="stylesheet" href="/css/style.css?v=20240705b">
    <link rel="stylesheet" href="/css/themes.css?v=20240705b">
    <link rel="stylesheet" href="/css/desktop.css?v=20240705b">
    <link rel="stylesheet" href="/css/window.css?v=20240705b">
    <link rel="stylesheet" href="/css/widget.css?v=20240705b">
    <link rel="stylesheet" href="/css/widgets-extended.css?v=20240705b">
    <link rel="stylesheet" href="/css/pet.css?v=20240705b">
    <script src="/js/i18n.js?v=20240705b" defer></script>
    <script src="/js/auth.js?v=20240705b" defer></script>
    <script src="/js/widget.js?v=20240705b" defer></script>
    <script src="/js/widgets-extended.js?v=20240705b" defer></script>
    <script src="/js/pet.js?v=20240705b" defer></script>
</head>
<body>
    <script>(function(){var t=localStorage.getItem('devtools-theme')||'dark';document.body.className='theme-'+t;})()</script>

    <!-- 顶部导航 -->
    <header class="navbar">
        <div class="nav-inner">
            <a href="/" class="logo">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <rect width="28" height="28" rx="6" fill="url(#logo-grad)"/>
                    <path d="M7 9h3l4 10-4-10h3l4 10-4-10h3l4 10" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    <defs><linearGradient id="logo-grad" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
                </svg>
                <span class="logo-text">DevTools</span>
                <span class="logo-badge">STATION</span>
            </a>
            <div class="nav-search" id="navSearch">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <input type="text" id="searchInput" data-i18n-placeholder="search.placeholder" placeholder="搜索工具... (支持拼音、英文)" autocomplete="off">
                <kbd class="search-kbd">⌘K</kbd>
                <div class="search-dropdown" id="searchDropdown"></div>
            </div>
            <div class="nav-actions">
                <button class="btn-store" id="btnOpenStore" title="工具商店">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                    <span>工具商店</span>
                </button>
                <button class="btn-store" id="btnOpenWidgets" title="小组件" style="background:rgba(139,92,246,0.06);border-color:rgba(139,92,246,0.3);color:#a78bfa;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                    <span>小组件</span>
                </button>
                <div class="theme-switcher"></div>
                <div class="lang-switcher"></div>
                <a href="/doc.html" class="btn-ghost" target="_blank" data-i18n="nav.api_docs">API 文档</a>
            </div>
        </div>
    </header>

    <!-- 桌面区域 -->
    <main class="desktop" id="desktop">
        <!-- 桌面背景网格 -->
        <div class="desktop-bg"></div>
        <!-- 🌸 可爱浮动粒子 -->
        <div class="desktop-particles">
            <span class="particle">🌸</span><span class="particle">💕</span>
            <span class="particle">✨</span><span class="particle">🎀</span>
            <span class="particle">💖</span><span class="particle">🌷</span>
            <span class="particle">💫</span><span class="particle">🍬</span>
        </div>

        <!-- 空状态提示（默认隐藏，JS 决定显示） -->
        <div class="desktop-empty" id="desktopEmpty" style="display:none">
            <div class="desktop-empty-icon">📦</div>
            <h2>你的桌面还是空的</h2>
            <p>点击右上角「工具商店」挑选你需要的工具<br>添加到桌面后，图标可以随意拖动摆放</p>
            <button class="btn-primary" onclick="document.getElementById('btnOpenStore').click()">
                逛逛工具商店
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
            </button>
        </div>

        <!-- 桌面图标容器 -->
        <div class="desktop-icons" id="desktopIcons"></div>

        <!-- 右下角工具统计 -->
        <div class="desktop-info" id="desktopInfo">
            <span id="desktopToolCount">0 个工具</span>
        </div>
    </main>

    <!-- 工具商店面板（从右侧滑出） -->
    <div class="store-overlay" id="storeOverlay"></div>
    <aside class="store-panel" id="storePanel">
        <div class="store-header">
            <h2>🛍️ 工具商店</h2>
            <p>挑选你需要的工具，添加到桌面</p>
            <button class="store-close" id="btnCloseStore" title="关闭">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>

        <!-- 商店内搜索 -->
        <div class="store-search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="storeSearchInput" placeholder="搜索工具..." autocomplete="off">
        </div>

        <!-- 商店工具列表 -->
        <div class="store-body" id="storeBody">
            <!-- 按分类动态渲染 -->
        </div>
    </aside>

    <!-- 右键菜单 -->
    <div class="context-menu" id="contextMenu">
        <div class="context-item" data-action="open">打开工具</div>
        <div class="context-divider"></div>
        <div class="context-item" data-action="add-widget">🧩 添加小组件</div>
        <div class="context-divider"></div>
        <div class="context-item context-danger" data-action="remove">从桌面移除</div>
    </div>

    <!-- 桌面空白右键菜单 -->
    <div class="desktop-context-menu" id="desktopContextMenu">
        <div class="context-item" data-action="desktop-settings">⚙️ 桌面设置</div>
        <div class="context-divider"></div>
        <div class="context-item" data-action="edit-bg">🖼️ 编辑背景</div>
        <div class="context-item" data-action="view-bg">🔍 查看背景</div>
        <div class="context-divider"></div>
        <div class="context-item" data-action="reset-widget-layout">🧩 重置小组件排列</div>
        <div class="context-divider"></div>
        <div class="context-item" data-action="refresh">🔄 刷新页面</div>
    </div>

    <!-- Toast -->
    <div class="desktop-toast" id="desktopToast"></div>

    <script src="/js/theme.js?v=20240705b"></script>
    <script src="/js/page-skin.js?v=20240705c"></script>
    <script src="/js/window.js?v=20240705b"></script>
    <script src="/js/main.js?v=20240705b"></script>
</body>
</html>
