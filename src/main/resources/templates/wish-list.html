<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tool.name} + ' - DevTools Station'">愿望清单 - DevTools Station</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --bg: #fff5fb; --card-bg: #ffffff; --text: #5d3a5c;
            --text-secondary: #9a7e9b; --accent: #f472b6; --accent-light: #fce7f3;
            --accent-dark: #db2777; --border: #f5d4e8;
            --shadow: 0 6px 28px rgba(244,114,182,0.12);
            --radius: 18px; --radius-sm: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #fff5fb 0%, #fdf2f8 20%, #fce7f3 50%, #f3e8ff 80%, #fff5fb 100%);
            min-height: 100vh; color: var(--text); line-height: 1.6;
        }
        .floating-decorations { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .float-item { position: absolute; opacity: 0.08; font-size: 2.3rem; animation: floatSlow 20s infinite ease-in-out; }
        .float-item:nth-child(1) { top: 5%; left: 8%; animation-delay: 0s; }
        .float-item:nth-child(2) { top: 15%; right: 10%; animation-delay: -5s; font-size: 1.9rem; }
        .float-item:nth-child(3) { top: 40%; left: 5%; animation-delay: -10s; font-size: 2.8rem; }
        .float-item:nth-child(4) { top: 60%; right: 8%; animation-delay: -15s; font-size: 2rem; }
        .float-item:nth-child(5) { top: 75%; left: 28%; animation-delay: -3s; font-size: 2.4rem; }
        .float-item:nth-child(6) { top: 25%; left: 55%; animation-delay: -12s; font-size: 1.7rem; }
        @keyframes floatSlow {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-28px) rotate(6deg) scale(1.1); }
            50% { transform: translateY(-8px) rotate(-3deg) scale(0.93); }
            75% { transform: translateY(-36px) rotate(5deg) scale(1.04); }
            100% { transform: translateY(0) rotate(0deg) scale(1); }
        }

        .container { max-width: 650px; margin: 0 auto; padding: 20px 20px 60px; position: relative; z-index: 1; }
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 24px; margin-bottom: 10px;
            background: rgba(255,255,255,0.85); backdrop-filter: blur(12px);
            border-radius: var(--radius-sm); box-shadow: var(--shadow);
        }
        .topbar .brand { font-size: 0.95rem; font-weight: 600; color: var(--accent-dark); }
        .topbar .page-title { font-size: 0.9rem; color: var(--text-secondary); }

        .header { text-align: center; padding: 35px 20px 20px; }
        .header h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #ec4899, #a855f7, #f472b6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 8px; letter-spacing: -0.3px;
        }
        .header .subtitle { color: var(--text-secondary); font-size: 1rem; }

        /* Progress */
        .progress-section {
            background: var(--card-bg); border-radius: var(--radius); padding: 20px 24px;
            box-shadow: var(--shadow); margin-bottom: 20px;
        }
        .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .progress-header .count { font-size: 0.95rem; font-weight: 600;
            background: linear-gradient(135deg, #ec4899, #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .progress-header .percent { font-size: 0.9rem; color: var(--text-secondary); }
        .progress-bar-wrap { height: 10px; background: #fce7f3; border-radius: 20px; overflow: hidden; }
        .progress-bar-fill {
            height: 100%; background: linear-gradient(90deg, #f472b6, #a855f7);
            border-radius: 20px; transition: width 0.5s ease;
        }

        /* Add */
        .add-section {
            background: var(--card-bg); border-radius: var(--radius); padding: 18px 22px;
            box-shadow: var(--shadow); margin-bottom: 20px;
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
        }
        .add-section input {
            flex: 1; min-width: 160px; padding: 12px 16px; border: 2px solid var(--border);
            border-radius: 25px; font-size: 0.95rem; outline: none; color: var(--text);
            transition: border-color 0.3s;
        }
        .add-section input:focus { border-color: #f472b6; }
        .category-pick {
            display: flex; gap: 6px; flex-wrap: wrap;
        }
        .cat-chip {
            width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--border);
            background: #fff; cursor: pointer; font-size: 1.3rem;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.25s;
        }
        .cat-chip:hover, .cat-chip.selected { border-color: #f472b6; background: #fdf2f8; transform: scale(1.1); }
        .add-btn {
            width: 44px; height: 44px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, #f472b6, #a855f7);
            color: #fff; font-size: 1.4rem; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(244,114,182,0.3); flex-shrink: 0;
        }
        .add-btn:hover { transform: scale(1.08); }

        /* Filter */
        .filter-row {
            display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
        }
        .filter-chip {
            padding: 6px 16px; border-radius: 20px; border: 2px solid var(--border);
            background: #fff; cursor: pointer; font-size: 0.85rem; color: var(--text-secondary);
            transition: all 0.25s;
        }
        .filter-chip:hover { border-color: #f472b6; }
        .filter-chip.active {
            border-color: #f472b6; background: #fdf2f8; color: var(--accent-dark); font-weight: 600;
        }

        /* Wish items */
        .wish-list { display: flex; flex-direction: column; gap: 10px; }
        .wish-item {
            background: var(--card-bg); border-radius: var(--radius-sm); padding: 16px 20px;
            box-shadow: var(--shadow); border: 1px solid var(--border);
            display: flex; align-items: center; gap: 14px;
            transition: all 0.35s; animation: wishIn 0.4s ease;
        }
        @keyframes wishIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .wish-item.done {
            opacity: 0.6; text-decoration: none;
        }
        .wish-item.done .wish-text { text-decoration: line-through; }
        .wish-item.done .wish-cat { filter: grayscale(0.3); }
        .wish-item.removing { animation: wishOut 0.35s ease forwards; }
        @keyframes wishOut { to { transform: translateX(60px); opacity: 0; } }

        .wish-check {
            width: 28px; height: 28px; border-radius: 50%; border: 2px solid #e8d5e0;
            flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.3s; background: #fff;
        }
        .wish-item.done .wish-check {
            border-color: #f472b6; background: linear-gradient(135deg, #f472b6, #a855f7);
        }
        .wish-check::after {
            content: '✓'; color: transparent; font-size: 0.85rem; font-weight: 700; transition: color 0.3s;
        }
        .wish-item.done .wish-check::after { color: #fff; }
        .wish-cat { font-size: 1.6rem; flex-shrink: 0; }
        .wish-text { flex: 1; font-size: 1rem; color: var(--text); }
        .wish-star { font-size: 1.1rem; cursor: pointer; transition: transform 0.3s; flex-shrink: 0; }
        .wish-star:hover { transform: scale(1.3); }
        .wish-del {
            font-size: 1.2rem; cursor: pointer; color: #d1b8c8; transition: color 0.3s; flex-shrink: 0; padding: 4px;
        }
        .wish-del:hover { color: #ef4444; }

        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-secondary); }
        .empty-state .big-emoji { font-size: 4rem; margin-bottom: 12px; }
        .empty-state h3 { font-size: 1.2rem; margin-bottom: 6px; color: var(--text); }

        .btn-ghost {
            display: inline-block; padding: 10px 24px;
            background: transparent; color: var(--accent-dark);
            border: 2px solid var(--border); border-radius: 25px;
            font-size: 0.9rem; cursor: pointer; transition: all 0.3s;
        }
        .btn-ghost:hover { border-color: #f472b6; background: #fdf2f8; }
        .action-row { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(244,114,182,0.92); color: #fff; padding: 12px 28px;
            border-radius: 25px; font-size: 0.95rem; z-index: 999;
            animation: toastIn 0.4s ease, toastOut 0.4s 1.8s ease forwards;
            box-shadow: 0 8px 30px rgba(244,114,182,0.3);
        }
        @keyframes toastIn { from { transform: translateX(-50%) translateY(20px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateX(-50%) translateY(-10px); } }
    </style>
</head>
<body>
<div class="floating-decorations">
    <span class="float-item">📔</span><span class="float-item">💖</span><span class="float-item">✨</span>
    <span class="float-item">🌸</span><span class="float-item">💫</span><span class="float-item">🎀</span>
</div>

<div class="container">
    <div class="topbar">
        <span class="brand">🌸 DevTools Station</span>
        <span class="page-title" th:text="${tool.name}">愿望清单</span>
    </div>

    <div class="header">
        <h1>📔 愿望清单</h1>
        <p class="subtitle">写下你的小心愿，一个一个去实现 💖</p>
    </div>

    <!-- Add -->
    <div class="add-section">
        <input type="text" id="wishInput" placeholder="写下你的愿望..." maxlength="60" onkeydown="if(event.key==='Enter')addWish()">
        <div class="category-pick" id="catPicker"></div>
        <button class="add-btn" onclick="addWish()">＋</button>
    </div>

    <!-- Filter -->
    <div class="filter-row" id="filterRow"></div>

    <!-- Progress -->
    <div class="progress-section">
        <div class="progress-header">
            <span class="count" id="progressCount">✨ 0 / 0 已完成</span>
            <span class="percent" id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressBar" style="width:0%"></div></div>
    </div>

    <!-- Wish List -->
    <div class="wish-list" id="wishList"></div>
    <div class="empty-state" id="emptyState">
        <div class="big-emoji">📔</div>
        <h3>还没有愿望呢~</h3>
        <p>写下你的第一个小心愿吧 🌸</p>
    </div>
    <div class="action-row" id="actionRow" style="display:none;">
        <button class="btn-ghost" onclick="clearDone()">🧹 清空已完成</button>
        <button class="btn-ghost" onclick="clearAll()">🗑️ 清空全部</button>
    </div>
</div>

<script>
(function() {
    var STORAGE_KEY = 'wish-list-data';
    var cats = [
        { emoji: '❤️', key: 'love' },
        { emoji: '🎯', key: 'goal' },
        { emoji: '✈️', key: 'travel' },
        { emoji: '📚', key: 'learn' },
        { emoji: '🍰', key: 'food' },
        { emoji: '🌸', key: 'other' }
    ];
    var selectedCat = '❤️';
    var filterKey = 'all';
    var wishes = [];

    function loadWishes() {
        try { var raw = localStorage.getItem(STORAGE_KEY); wishes = raw ? JSON.parse(raw) : []; }
        catch(e) { wishes = []; }
        if (!wishes.length) {
            wishes = [
                { id: Date.now(), text: '喝一杯奶茶 🧋', cat: 'food', star: true, done: false },
                { id: Date.now()+1, text: '存钱买一台相机 📸', cat: 'goal', star: false, done: false },
                { id: Date.now()+2, text: '和闺蜜去一次迪士尼 🏰', cat: 'travel', star: true, done: false }
            ];
            saveWishes();
        }
    }

    function saveWishes() { localStorage.setItem(STORAGE_KEY, JSON.stringify(wishes)); }

    function renderCatPicker() {
        var html = '';
        cats.forEach(function(c) {
            html += '<button class="cat-chip' + (selectedCat === c.key ? ' selected' : '')
                + '" onclick="selectCat(\'' + c.key + '\')" title="' + c.key + '">' + c.emoji + '</button>';
        });
        document.getElementById('catPicker').innerHTML = html;
    }

    function renderFilter() {
        var html = '<button class="filter-chip' + (filterKey === 'all' ? ' active' : '') + '" onclick="setFilter(\'all\')">🌟 全部</button>';
        cats.forEach(function(c) {
            html += '<button class="filter-chip' + (filterKey === c.key ? ' active' : '')
                + '" onclick="setFilter(\'' + c.key + '\')">' + c.emoji + ' ' + c.key + '</button>';
        });
        document.getElementById('filterRow').innerHTML = html;
    }

    function renderList() {
        var filtered = wishes.filter(function(w) { return filterKey === 'all' || w.cat === filterKey; });
        // Sort: not-done first, starred first
        filtered.sort(function(a, b) {
            if (a.done !== b.done) return a.done ? 1 : -1;
            if (a.star !== b.star) return a.star ? -1 : 1;
            return b.id - a.id;
        });

        var html = '';
        filtered.forEach(function(w) {
            html += '<div class="wish-item' + (w.done ? ' done' : '') + '" id="wish-' + w.id + '">'
                + '<div class="wish-check" onclick="toggleWish(' + w.id + ')"></div>'
                + '<span class="wish-cat">' + (cats.find(function(c) { return c.key === w.cat; }) || cats[0]).emoji + '</span>'
                + '<span class="wish-text">' + escapeHtml(w.text) + '</span>'
                + '<span class="wish-star" onclick="toggleStar(' + w.id + ')">' + (w.star ? '⭐' : '☆') + '</span>'
                + '<span class="wish-del" onclick="deleteWish(' + w.id + ')" title="删除">🗑️</span>'
                + '</div>';
        });
        document.getElementById('wishList').innerHTML = html;

        var total = wishes.length;
        var done = wishes.filter(function(w) { return w.done; }).length;
        var pct = total === 0 ? 0 : Math.round(done / total * 100);
        document.getElementById('progressCount').textContent = '✨ ' + done + ' / ' + total + ' 已完成';
        document.getElementById('progressPercent').textContent = pct + '%';
        document.getElementById('progressBar').style.width = pct + '%';

        document.getElementById('emptyState').style.display = wishes.length === 0 ? '' : 'none';
        document.getElementById('actionRow').style.display = wishes.length === 0 ? 'none' : '';
    }

    function escapeHtml(str) {
        var d = document.createElement('div'); d.textContent = str; return d.innerHTML;
    }

    window.selectCat = function(key) { selectedCat = key; renderCatPicker(); };
    window.setFilter = function(key) { filterKey = key; renderFilter(); renderList(); };

    window.addWish = function() {
        var input = document.getElementById('wishInput');
        var text = input.value.trim();
        if (!text) { showToast('写点什么吧~ 📝'); return; }
        wishes.push({ id: Date.now(), text: text, cat: selectedCat, star: false, done: false });
        saveWishes(); input.value = ''; renderList();
        showToast('愿望已添加 🌸');
    };

    window.toggleWish = function(id) {
        var w = wishes.find(function(wi) { return wi.id === id; });
        if (!w) return;
        w.done = !w.done;
        saveWishes(); renderList();
        if (w.done) showToast('太棒了！又完成一个 ✨');
    };

    window.toggleStar = function(id) {
        var w = wishes.find(function(wi) { return wi.id === id; });
        if (!w) return;
        w.star = !w.star;
        saveWishes(); renderList();
    };

    window.deleteWish = function(id) {
        var el = document.getElementById('wish-' + id);
        if (el) el.classList.add('removing');
        setTimeout(function() {
            wishes = wishes.filter(function(wi) { return wi.id !== id; });
            saveWishes(); renderList();
        }, 350);
    };

    window.clearDone = function() {
        wishes = wishes.filter(function(w) { return !w.done; });
        saveWishes(); renderList(); showToast('已清空完成项 🧹');
    };

    window.clearAll = function() {
        if (confirm('确定要清空所有愿望吗？')) {
            wishes = []; saveWishes(); renderList(); showToast('已清空全部 🗑️');
        }
    };

    function showToast(msg) {
        var t = document.querySelector('.toast');
        if (t) t.remove();
        t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(function() { t.remove(); }, 2400);
    }

    // Init
    loadWishes();
    renderCatPicker();
    renderFilter();
    renderList();
})();
</script>
</body>
</html>
