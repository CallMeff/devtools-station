<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tool.name} + ' - DevTools Station'">悄悄话加密卡 - DevTools Station</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --bg: #fdf6fd;
            --card-bg: #ffffff;
            --text: #5d3a5c;
            --text-secondary: #9a7e9b;
            --accent: #ec4899;
            --accent-light: #fce7f3;
            --accent-dark: #be185d;
            --border: #f0d0e5;
            --shadow: 0 6px 30px rgba(236, 72, 153, 0.12);
            --radius: 18px;
            --radius-sm: 12px;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(160deg, #fdf2f8 0%, #fdf6fd 25%, #fef2f2 50%, #fdf6fd 75%, #fdf2f8 100%);
            min-height: 100vh;
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 750px; margin: 0 auto; padding: 20px 24px 80px;
            position: relative; z-index: 1;
        }

        /* Header */
        .header {
            text-align: center; padding: 40px 20px 28px;
        }
        .header h1 {
            font-size: 2.3rem;
            background: linear-gradient(135deg, #ec4899, #f472b6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .header p { color: var(--text-secondary); font-size: 1rem; }

        /* Tab switcher */
        .tab-bar {
            display: flex; background: var(--card-bg);
            border-radius: 50px; padding: 4px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .tab-btn {
            flex: 1; padding: 12px 20px;
            border-radius: 50px; border: none;
            background: transparent; color: var(--text-secondary);
            font-weight: 600; font-size: 1rem; cursor: pointer;
            transition: all 0.3s; font-family: inherit;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #f472b6, #ec4899);
            color: #fff; box-shadow: 0 3px 12px rgba(236, 72, 153, 0.35);
        }
        .tab-btn:hover:not(.active) { background: #fce7f3; color: var(--accent-dark); }

        /* Card */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .card-label {
            font-weight: 700; font-size: 1rem; margin-bottom: 10px;
            display: flex; align-items: center; gap: 8px;
            color: var(--text);
        }
        .card-label .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent);
        }

        textarea, input[type="text"] {
            width: 100%; padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 1rem; color: var(--text);
            background: #fef5fb;
            outline: none; transition: all 0.25s;
            font-family: inherit;
            resize: vertical;
        }
        textarea:focus, input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.1);
            background: #fff;
        }
        textarea { min-height: 100px; }
        input::placeholder, textarea::placeholder { color: #d4a8c5; }

        .row { display: flex; gap: 12px; align-items: center; }
        .row > * { flex: 1; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 6px; padding: 12px 28px;
            border: none; border-radius: 50px;
            font-weight: 700; font-size: 1rem; cursor: pointer;
            transition: all 0.3s; font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f472b6, #ec4899);
            color: #fff; width: 100%;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.45);
        }
        .btn-secondary {
            background: #fce7f3; color: var(--accent-dark);
            border: 1.5px solid var(--border);
        }
        .btn-secondary:hover { background: #fbcfe8; }
        .btn-sm { padding: 8px 16px; font-size: 0.85rem; }

        .result-box {
            background: linear-gradient(135deg, #fef5fb, #fdf2f8);
            border: 2px dashed var(--border);
            border-radius: var(--radius-sm);
            padding: 18px; margin-top: 14px;
            word-break: break-all; font-family: 'Courier New', monospace;
            font-size: 0.92rem; color: var(--accent-dark);
            min-height: 50px;
            position: relative;
        }
        .result-box .copy-btn {
            position: absolute; top: 8px; right: 8px;
            background: #fff; border: 1px solid var(--border);
            border-radius: 8px; padding: 4px 10px;
            font-size: 0.8rem; cursor: pointer;
            transition: all 0.2s; color: var(--accent);
        }
        .result-box .copy-btn:hover {
            background: var(--accent); color: #fff; border-color: var(--accent);
        }

        /* Envelope card */
        .envelope-card {
            background: linear-gradient(145deg, #fce7f3 0%, #fdf2f8 30%, #fef5fb 60%, #f3e8ff 100%);
            border: 3px solid var(--accent);
            border-radius: 20px;
            padding: 30px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .envelope-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 4px;
            background: repeating-linear-gradient(90deg, #f472b6 0px, #f472b6 10px, #a855f7 10px, #a855f7 20px);
        }
        .envelope-card .envelope-icon {
            font-size: 3.5rem; margin-bottom: 12px;
            animation: floatEnvelope 2s infinite ease-in-out;
        }
        @keyframes floatEnvelope {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .envelope-card .secret-text {
            font-size: 1.3rem; font-weight: 700;
            color: var(--accent-dark); line-height: 1.8;
            padding: 16px; margin: 12px 0;
            background: rgba(255,255,255,0.6);
            border-radius: 14px; word-break: break-word;
        }
        .envelope-card .hint-text {
            font-size: 0.85rem; color: var(--text-secondary); margin-top: 8px;
        }
        .envelope-card .reveal-btn {
            margin-top: 16px;
        }
        .envelope-card .decrypt-input {
            margin-top: 12px; max-width: 280px; margin-left: auto; margin-right: auto;
        }

        /* Toast */
        .toast {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            background: #ec4899; color: #fff;
            padding: 12px 28px; border-radius: 50px;
            font-weight: 600; font-size: 0.95rem;
            box-shadow: 0 6px 25px rgba(236, 72, 153, 0.4);
            z-index: 1000; opacity: 0; pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast:not(.show) { transform: translateX(-50%) translateY(-20px); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        @media (max-width: 640px) {
            .header h1 { font-size: 1.8rem; }
            .row { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 th:text="${tool.name}">💌 悄悄话加密卡</h1>
        <p>把你的小秘密变成漂亮加密卡片，发给那个特别的人 💕</p>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('encrypt')">🔒 加密</button>
        <button class="tab-btn" onclick="switchTab('decrypt')">🔓 解密</button>
        <button class="tab-btn" onclick="switchTab('card')">💌 卡片模式</button>
    </div>

    <!-- 加密 -->
    <div class="tab-content active" id="tab-encrypt">
        <div class="card">
            <div class="card-label"><span class="dot"></span> 你想说什么悄悄话？</div>
            <textarea id="encryptInput" placeholder="写下你的小秘密...比如：今天的你超可爱 (◕ᴗ◕✿)"></textarea>

            <div class="card-label" style="margin-top:18px;"><span class="dot"></span> 🔑 设置一个小暗号</div>
            <input type="text" id="encryptKey" placeholder="只有你们两个人知道的暗号（可选）" maxlength="32">
            <div style="color:var(--text-secondary);font-size:0.82rem;margin-top:4px;">不填则随机生成一个可爱暗号 ✨</div>

            <button class="btn btn-primary" style="margin-top:20px;" onclick="doEncrypt()">
                🔒 生成加密卡片
            </button>

            <div class="result-box" id="encryptResult" style="display:none;">
                <button class="copy-btn" onclick="copyResult('encryptResultText')">📋 复制</button>
                <span id="encryptResultText"></span>
            </div>
        </div>
    </div>

    <!-- 解密 -->
    <div class="tab-content" id="tab-decrypt">
        <div class="card">
            <div class="card-label"><span class="dot"></span> 🔍 粘贴加密内容</div>
            <textarea id="decryptInput" placeholder="粘贴那串神秘代码..."></textarea>

            <div class="card-label" style="margin-top:18px;"><span class="dot"></span> 🔑 输入暗号</div>
            <input type="text" id="decryptKey" placeholder="输入之前设置的暗号" maxlength="32">

            <button class="btn btn-primary" style="margin-top:20px;" onclick="doDecrypt()">
                🔓 解锁悄悄话
            </button>

            <div class="result-box" id="decryptResult" style="display:none;">
                <button class="copy-btn" onclick="copyResult('decryptResultText')">📋 复制</button>
                <span id="decryptResultText"></span>
            </div>
        </div>
    </div>

    <!-- 卡片模式 -->
    <div class="tab-content" id="tab-card">
        <div class="card">
            <div class="card-label"><span class="dot"></span> 💌 制作一张加密贺卡</div>
            <textarea id="cardMessage" placeholder="写一段暖心的话..." style="min-height:80px;"></textarea>

            <div class="row" style="margin-top:14px;">
                <input type="text" id="cardSender" placeholder="来自谁（比如：你的小可爱）" maxlength="20">
                <input type="text" id="cardTo" placeholder="给谁（比如：最爱的TA）" maxlength="20">
            </div>

            <div class="card-label" style="margin-top:16px;"><span class="dot"></span> 🎨 卡片颜色</div>
            <div class="row">
                <button class="btn btn-sm btn-secondary" style="background:#fce7f3;" onclick="cardColor='pink';updateCardPreview()">🌸 粉色</button>
                <button class="btn btn-sm btn-secondary" style="background:#e0e7ff;" onclick="cardColor='purple';updateCardPreview()">💜 紫色</button>
                <button class="btn btn-sm btn-secondary" style="background:#fef3c7;" onclick="cardColor='warm';updateCardPreview()">🧡 暖橙</button>
                <button class="btn btn-sm btn-secondary" style="background:#d1fae5;" onclick="cardColor='mint';updateCardPreview()">🍃 薄荷</button>
            </div>

            <button class="btn btn-primary" style="margin-top:18px;" onclick="doCardEncrypt()">
                💌 生成加密贺卡
            </button>
        </div>

        <div class="envelope-card" id="envelopeCard" style="display:none;">
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    let cardColor = 'pink';
    let currentCardData = null;

    // Tab 切换
    window.switchTab = function(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => {
            const t = b.textContent.trim();
            if ((tab === 'encrypt' && t.includes('加密')) ||
                (tab === 'decrypt' && t.includes('解密')) ||
                (tab === 'card' && t.includes('卡片'))) {
                b.classList.add('active');
            }
        });
        document.getElementById('tab-' + tab).classList.add('active');
    };

    // 简单但好看的加密方法：字符偏移 + 密钥混合
    function cuteEncrypt(text, key) {
        if (!key) key = generateCuteKey();
        let result = '';
        for (let i = 0; i < text.length; i++) {
            const cc = text.charCodeAt(i);
            const kc = key.charCodeAt(i % key.length);
            const shifted = ((cc + kc + i * 7) % 65536);
            result += shifted.toString(36).padStart(4, '0');
        }
        // 混入密钥信息（密钥也编码一下）
        let keyEnc = '';
        for (let i = 0; i < key.length; i++) {
            keyEnc += (key.charCodeAt(i) + 17).toString(36).padStart(2, '0');
        }
        return '💌' + keyEnc + '🔐' + result + '✨';
    }

    function cuteDecrypt(encrypted, key) {
        try {
            // 去掉装饰符号，按分隔符拆
            const cleaned = encrypted.replace(/^💌|✨$/g, '');
            const parts = cleaned.split('🔐');
            if (parts.length !== 2) throw new Error('格式不对哦~');
            
            const keyEnc = parts[0];
            const data = parts[1];
            
            // 解码密钥
            let extractedKey = '';
            for (let i = 0; i < keyEnc.length; i += 2) {
                extractedKey += String.fromCharCode(parseInt(keyEnc.substr(i, 2), 36) - 17);
            }
            
            if (key && key !== extractedKey) {
                return { error: true, msg: '❌ 暗号不对哦~ 再试试？', hint: '提示：暗号是 "' + extractedKey + '" 哦~' };
            }
            
            // 解码内容
            let result = '';
            for (let i = 0; i < data.length; i += 4) {
                const shifted = parseInt(data.substr(i, 4), 36);
                if (isNaN(shifted)) throw new Error('解密失败');
                const kc = extractedKey.charCodeAt((i / 4) % extractedKey.length);
                const original = ((shifted - kc - (i / 4) * 7) % 65536 + 65536) % 65536;
                result += String.fromCharCode(original);
            }
            return { error: false, text: result, key: extractedKey };
        } catch (e) {
            return { error: true, msg: '❌ 这串代码好像不太对劲...确定复制完整了吗？' };
        }
    }

    function generateCuteKey() {
        const cuteWords = ['草莓', '奶茶', '星星', '月亮', '布丁', '泡芙', '棉花糖', '冰淇淋', '奶盖', '芝士', '芋泥', '樱花', '蜜桃', '抹茶', '可可', '珍珠', '汤圆', '年糕', '果冻', '雪糕'];
        return cuteWords[Math.floor(Math.random() * cuteWords.length)] + Math.floor(Math.random() * 99 + 1);
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        clearTimeout(t._timeout);
        t._timeout = setTimeout(() => t.classList.remove('show'), 2200);
    }

    function copyResult(id) {
        const el = document.getElementById(id);
        const text = el.textContent;
        navigator.clipboard.writeText(text).then(() => showToast('📋 已复制！发给 TA 吧~'));
    }

    window.doEncrypt = function() {
        const text = document.getElementById('encryptInput').value.trim();
        let key = document.getElementById('encryptKey').value.trim();
        
        if (!text) { showToast('💌 请先写点悄悄话嘛~'); return; }
        
        const encrypted = cuteEncrypt(text, key || null);
        const resultBox = document.getElementById('encryptResult');
        const resultText = document.getElementById('encryptResultText');
        
        resultText.textContent = encrypted;
        resultBox.style.display = 'block';
        
        // 设置密钥到解密区
        if (key) document.getElementById('decryptKey').value = key;
        document.getElementById('decryptInput').value = encrypted;
        
        showToast('✅ 加密成功！复制去发给 TA 吧~');
    };

    window.doDecrypt = function() {
        const encrypted = document.getElementById('decryptInput').value.trim();
        const key = document.getElementById('decryptKey').value.trim();
        
        if (!encrypted) { showToast('🔍 请粘贴加密内容哦~'); return; }
        
        const result = cuteDecrypt(encrypted, key || null);
        const resultBox = document.getElementById('decryptResult');
        const resultText = document.getElementById('decryptResultText');
        
        if (result.error) {
            resultText.innerHTML = result.msg + (result.hint ? '<br><small style="color:var(--text-secondary);">' + result.hint + '</small>' : '');
        } else {
            resultText.innerHTML = '💖 <strong>' + result.text + '</strong>';
            showToast('🎉 解锁成功！');
            document.getElementById('encryptKey').value = result.key;
        }
        resultBox.style.display = 'block';
    };

    window.doCardEncrypt = function() {
        const message = document.getElementById('cardMessage').value.trim();
        const sender = document.getElementById('cardSender').value.trim() || '神秘人';
        const to = document.getElementById('cardTo').value.trim() || '亲爱的TA';
        
        if (!message) { showToast('💌 写下想说的话嘛~'); return; }
        
        const key = generateCuteKey();
        const encrypted = cuteEncrypt(message, key);
        currentCardData = { encrypted, key, sender, to, color: cardColor };
        renderCard();
    };

    function renderCard() {
        if (!currentCardData) return;
        const d = currentCardData;
        const card = document.getElementById('envelopeCard');
        
        const colorMap = {
            pink: { bg: 'linear-gradient(145deg, #fce7f3 0%, #fdf2f8 30%, #fef5fb 60%, #f3e8ff 100%)', border: '#ec4899', accent: '#f472b6' },
            purple: { bg: 'linear-gradient(145deg, #e0e7ff 0%, #ede9fe 30%, #f5f3ff 60%, #f3e8ff 100%)', border: '#a855f7', accent: '#c084fc' },
            warm: { bg: 'linear-gradient(145deg, #fef3c7 0%, #fef9ed 30%, #fff7ed 60%, #fce7f3 100%)', border: '#f59e0b', accent: '#f97316' },
            mint: { bg: 'linear-gradient(145deg, #d1fae5 0%, #ecfdf5 30%, #f0fdf4 60%, #fce7f3 100%)', border: '#10b981', accent: '#34d399' },
        };
        const cm = colorMap[d.color] || colorMap.pink;
        
        card.style.background = cm.bg;
        card.style.borderColor = cm.border;
        card.style.display = 'block';
        
        card.innerHTML = `
            <div class="envelope-icon">💌</div>
            <div style="font-size:1.1rem;font-weight:700;color:${cm.border};margin-bottom:8px;">
                💝 来自 ${d.sender}
            </div>
            <div style="font-size:0.9rem;color:var(--text-secondary);margin-bottom:2px;">
                给 ${d.to}
            </div>
            <div class="secret-text">
                ${d.encrypted}
            </div>
            <div class="hint-text">
                💡 暗号提示：${'●'.repeat(d.key.length)}（${d.key.length}个字）
            </div>
            <div class="hint-text" style="margin-top:4px;">
                复制这段密文，在「解密」标签输入暗号解锁~
            </div>
            <button class="btn btn-secondary reveal-btn" onclick="revealCard()">
                🔓 输入暗号解密
            </button>
            <input type="text" class="decrypt-input" id="cardKeyInput" 
                placeholder="输入暗号解锁" maxlength="32"
                style="display:none;margin-top:12px;">
            <button class="btn btn-primary" style="display:none;margin-top:8px;" id="cardDecryptBtn" onclick="tryDecryptCard()">
                ✨ 解锁查看
            </button>
            <div id="cardRevealText" style="display:none;margin-top:16px;padding:16px;background:rgba(255,255,255,0.7);border-radius:14px;font-size:1.15rem;font-weight:600;color:var(--accent-dark);"></div>
            <button class="btn btn-sm btn-secondary" style="margin-top:16px;" onclick="copyResult('cardEncryptedText')">📋 复制密文</button>
            <span id="cardEncryptedText" style="display:none;">${d.encrypted}</span>
        `;
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    window.revealCard = function() {
        document.getElementById('cardKeyInput').style.display = 'block';
        document.getElementById('cardDecryptBtn').style.display = 'inline-flex';
        document.querySelector('.reveal-btn').style.display = 'none';
        document.getElementById('cardKeyInput').focus();
    };

    window.tryDecryptCard = function() {
        if (!currentCardData) return;
        const inputKey = document.getElementById('cardKeyInput').value.trim();
        const result = cuteDecrypt(currentCardData.encrypted, inputKey);
        const revealDiv = document.getElementById('cardRevealText');
        revealDiv.style.display = 'block';
        
        if (result.error) {
            revealDiv.innerHTML = result.msg + (result.hint ? '<br><small style="font-size:0.85rem;color:var(--text-secondary);">' + result.hint + '</small>' : '');
            revealDiv.style.color = '#ef4444';
        } else {
            revealDiv.innerHTML = '💖 ' + result.text;
            revealDiv.style.color = 'var(--accent-dark)';
            showToast('🎉 解密成功！');
        }
    };

    function updateCardPreview() {
        if (currentCardData) { currentCardData.color = cardColor; renderCard(); }
    }

    // 回车键触发
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && e.ctrlKey) {
            const activeTab = document.querySelector('.tab-content.active');
            if (activeTab.id === 'tab-encrypt') doEncrypt();
            else if (activeTab.id === 'tab-decrypt') doDecrypt();
        }
    });

    // 页面加载：预设一个可爱示例
    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('encryptInput').value = '今天的你超可爱～(｡♥‿♥｡)';
    });
</script>
</body>
</html>
