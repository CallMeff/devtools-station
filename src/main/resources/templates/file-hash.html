<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tool.name} + ' - DevTools Station'">文件哈希校验器 - DevTools Station</title>
    <meta name="description" th:content="${tool.description}">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script>(function(){var t=localStorage.getItem('devtools-theme');if(t){document.documentElement.className='theme-'+t;}})()</script>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg-primary,#1a1a2e);color:var(--text-primary,#ddd);min-height:100vh;display:flex;flex-direction:column}
        .topbar{display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--bg-secondary,#1e1e2e);border-bottom:1px solid var(--border-color,#333);min-height:42px;flex-shrink:0}
        .topbar .brand{display:flex;align-items:center;gap:8px;margin-right:auto}
        .topbar .brand a{color:var(--accent-color,#6366f1);text-decoration:none;font-size:18px;font-weight:bold}
        .topbar .brand .sep{color:var(--text-muted,#888);margin:0 4px}
        .topbar .brand .tool-name{color:var(--text-primary,#ddd);font-size:14px}
        .topbar button{padding:5px 12px;border:1px solid var(--border-color,#444);border-radius:6px;background:var(--bg-tertiary,#2a2a3a);color:var(--text-primary,#ddd);cursor:pointer;font-size:13px;transition:all .15s}
        .topbar button:hover{background:var(--accent-color,#6366f1);border-color:var(--accent-color,#6366f1);color:#fff}

        .page-content{flex:1;max-width:900px;margin:0 auto;width:100%;padding:20px;display:flex;flex-direction:column;gap:20px}

        .intro-box{background:var(--bg-secondary,#1e1e2e);border:1px solid var(--border-color,#333);border-radius:12px;padding:20px;text-align:center}
        .intro-box h2{font-size:20px;color:var(--accent-color,#6366f1);margin-bottom:8px}
        .intro-box p{color:var(--text-muted,#888);font-size:13px;line-height:1.6}

        .drop-zone{background:var(--bg-secondary,#1e1e2e);border:2px dashed var(--border-color,#555);border-radius:16px;padding:50px 20px;text-align:center;cursor:pointer;transition:all .3s;position:relative}
        .drop-zone:hover,.drop-zone.dragover{border-color:var(--accent-color,#6366f1);background:var(--bg-tertiary,#2a2a3a)}
        .drop-zone .icon{font-size:48px;margin-bottom:12px}
        .drop-zone h3{font-size:16px;color:var(--text-primary,#ddd);margin-bottom:6px}
        .drop-zone p{font-size:12px;color:var(--text-muted,#777)}
        .drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}

        .algo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
        .algo-chip{padding:10px 14px;border:1px solid var(--border-color,#444);border-radius:10px;background:var(--bg-tertiary,#2a2a3a);color:var(--text-primary,#ddd);cursor:pointer;font-size:12px;text-align:center;transition:all .15s;font-family:'SF Mono','JetBrains Mono','Consolas',monospace}
        .algo-chip:hover{border-color:var(--accent-color,#6366f1)}
        .algo-chip.active{background:var(--accent-color,#6366f1);border-color:var(--accent-color,#6366f1);color:#fff}

        .results{display:flex;flex-direction:column;gap:16px}
        .result-card{background:var(--bg-secondary,#1e1e2e);border:1px solid var(--border-color,#333);border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:16px;transition:all .3s}
        .result-card.calculating{opacity:.6}
        .result-card .hash-icon{font-size:28px;flex-shrink:0}
        .result-card .hash-info{flex:1;min-width:0}
        .result-card .hash-algo{font-size:12px;color:var(--text-muted,#888);margin-bottom:4px;font-family:'SF Mono','JetBrains Mono','Consolas',monospace}
        .result-card .hash-value{font-size:14px;font-family:'SF Mono','JetBrains Mono','Consolas',monospace;word-break:break-all;color:var(--text-primary,#ddd);line-height:1.5}
        .result-card .hash-spinner{width:16px;height:16px;border:2px solid var(--border-color,#555);border-top-color:var(--accent-color,#6366f1);border-radius:50%;animation:spin .6s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .result-card .copy-btn{padding:6px 12px;border:1px solid var(--border-color,#444);border-radius:6px;background:var(--bg-tertiary,#2a2a3a);color:var(--text-muted,#aaa);cursor:pointer;font-size:11px;transition:all .15s;flex-shrink:0;white-space:nowrap}
        .result-card .copy-btn:hover{background:var(--accent-color,#6366f1);color:#fff;border-color:var(--accent-color,#6366f1)}

        .verify-section{background:var(--bg-secondary,#1e1e2e);border:1px solid var(--border-color,#333);border-radius:12px;padding:20px}
        .verify-section h3{font-size:14px;color:var(--text-primary,#ddd);margin-bottom:14px}
        .verify-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
        .verify-row .form-group{flex:1;min-width:200px}
        .verify-row .form-group label{display:block;font-size:12px;color:var(--text-muted,#888);margin-bottom:6px}
        .verify-row .form-group input,.verify-row .form-group select{width:100%;padding:8px 12px;background:var(--bg-tertiary,#2a2a3a);border:1px solid var(--border-color,#444);border-radius:8px;color:var(--text-primary,#ddd);font-size:13px;font-family:'SF Mono','JetBrains Mono','Consolas',monospace;outline:none}
        .verify-row .form-group input:focus{border-color:var(--accent-color,#6366f1)}
        .verify-row .form-group select{font-family:inherit}

        .btn{padding:8px 18px;border:1px solid var(--border-color,#444);border-radius:8px;background:var(--bg-tertiary,#2a2a3a);color:var(--text-primary,#ddd);cursor:pointer;font-size:13px;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
        .btn:hover{background:var(--accent-color,#6366f1);border-color:var(--accent-color,#6366f1);color:#fff}
        .btn.primary{background:var(--accent-color,#6366f1);border-color:var(--accent-color,#6366f1);color:#fff}
        .btn.success{background:#38a169;border-color:#38a169;color:#fff}

        .verify-result{padding:12px 16px;border-radius:8px;font-size:14px;margin-top:12px;display:none}
        .verify-result.match{display:block;background:rgba(56,161,105,.15);color:#68d391;border:1px solid rgba(56,161,105,.3)}
        .verify-result.mismatch{display:block;background:rgba(229,62,62,.15);color:#fc8181;border:1px solid rgba(229,62,62,.3)}

        .file-info{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg-tertiary,#2a2a3a);border-radius:10px;font-size:13px}
        .file-info .fi-name{color:var(--text-primary,#ddd);font-weight:500}
        .file-info .fi-size{color:var(--text-muted,#888)}
        .file-info .fi-clear{margin-left:auto;cursor:pointer;color:var(--text-muted,#888);font-size:18px;transition:color .15s}
        .file-info .fi-clear:hover{color:#e53e3e}

        .toast{position:fixed;top:50px;left:50%;transform:translateX(-50%);background:var(--accent-color,#6366f1);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
        .toast.show{opacity:1}
    </style>
</head>
<body>
<div class="topbar">
    <div class="brand">
        <a href="/">⚡ DevTools</a>
        <span class="sep">/</span>
        <span class="tool-name" th:text="${tool.name}">文件哈希校验器</span>
    </div>
</div>

<div class="page-content">
    <div class="intro-box">
        <h2>🔐 文件哈希校验器</h2>
        <p>拖拽或选择文件，即时计算 <strong>MD5、SHA-1、SHA-256、SHA-512、CRC32</strong> 哈希值。<br>纯浏览器端运行，文件不上传服务器，安全私密。支持粘贴期望哈希值进行完整性校验。</p>
    </div>

    <!-- 算法选择 -->
    <div class="algo-grid" id="algoGrid">
        <div class="algo-chip active" data-algo="MD5">MD5</div>
        <div class="algo-chip active" data-algo="SHA-1">SHA-1</div>
        <div class="algo-chip active" data-algo="SHA-256">SHA-256</div>
        <div class="algo-chip active" data-algo="SHA-512">SHA-512</div>
        <div class="algo-chip" data-algo="CRC32">CRC32</div>
    </div>

    <!-- 拖拽区域 -->
    <div class="drop-zone" id="dropZone">
        <div class="icon">📂</div>
        <h3>拖拽文件到此处</h3>
        <p>或点击选择文件 | 支持任意类型文件 | 文件不上传服务器</p>
        <input type="file" id="fileInput">
    </div>

    <!-- 文件信息 -->
    <div class="file-info" id="fileInfo" style="display:none">
        <span>📄</span>
        <span class="fi-name" id="fileName"></span>
        <span class="fi-size" id="fileSize"></span>
        <span class="fi-clear" onclick="clearFile()" title="移除文件">✕</span>
    </div>

    <!-- 计算结果 -->
    <div class="results" id="results"></div>

    <!-- 校验区域 -->
    <div class="verify-section">
        <h3>🔍 哈希校验（验证文件完整性）</h3>
        <div class="verify-row">
            <div class="form-group">
                <label>算法</label>
                <select id="verifyAlgo">
                    <option value="MD5">MD5</option>
                    <option value="SHA-1">SHA-1</option>
                    <option value="SHA-256">SHA-256</option>
                    <option value="SHA-512">SHA-512</option>
                    <option value="CRC32">CRC32</option>
                </select>
            </div>
            <div class="form-group" style="flex:2">
                <label>期望哈希值</label>
                <input type="text" id="expectedHash" placeholder="粘贴期望的哈希值（不区分大小写）...">
            </div>
            <div class="form-group" style="flex:0">
                <button class="btn primary" onclick="verifyHash()" style="white-space:nowrap">校验</button>
            </div>
        </div>
        <div class="verify-result" id="verifyResult"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script>
var currentFile = null;
var computedHashes = {};

// 算法选择
document.querySelectorAll('.algo-chip').forEach(function(chip) {
    chip.addEventListener('click', function() {
        this.classList.toggle('active');
        if (currentFile) computeHashes();
    });
});

function getSelectedAlgos() {
    var chips = document.querySelectorAll('.algo-chip.active');
    var algos = [];
    chips.forEach(function(c) { algos.push(c.dataset.algo); });
    return algos;
}

// 拖拽处理
var dropZone = document.getElementById('dropZone');
var fileInput = document.getElementById('fileInput');

dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('dragover'); });
dropZone.addEventListener('drop', function(e) {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', function() {
    if (this.files.length > 0) handleFile(this.files[0]);
});

function handleFile(file) {
    currentFile = file;
    document.getElementById('fileInfo').style.display = 'flex';
    document.getElementById('fileName').textContent = file.name;
    document.getElementById('fileSize').textContent = formatSize(file.size);
    computeHashes();
}

function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1073741824) return (bytes / 1048576).toFixed(2) + ' MB';
    return (bytes / 1073741824).toFixed(2) + ' GB';
}

function clearFile() {
    currentFile = null;
    document.getElementById('fileInfo').style.display = 'none';
    document.getElementById('results').innerHTML = '';
    document.getElementById('verifyResult').className = 'verify-result';
    document.getElementById('verifyResult').textContent = '';
    computedHashes = {};
    fileInput.value = '';
}

function computeHashes() {
    if (!currentFile) return;
    var algos = getSelectedAlgos();
    if (algos.length === 0) { document.getElementById('results').innerHTML = ''; return; }

    var resultsDiv = document.getElementById('results');

    // 渲染空位+spinner
    var icons = { 'MD5':'🔑', 'SHA-1':'🔒', 'SHA-256':'🛡️', 'SHA-512':'🏰', 'CRC32':'🔖' };
    resultsDiv.innerHTML = algos.map(function(a) {
        return '<div class="result-card calculating" id="card-' + a + '">' +
            '<div class="hash-icon">' + (icons[a] || '🔐') + '</div>' +
            '<div class="hash-info">' +
                '<div class="hash-algo">' + a + '</div>' +
                '<div class="hash-value">计算中...</div>' +
            '</div>' +
            '<div class="hash-spinner"></div>' +
        '</div>';
    }).join('');

    var reader = new FileReader();
    reader.onload = function(e) {
        var wordArray = CryptoJS.lib.WordArray.create(new Uint8Array(e.target.result));

        algos.forEach(function(algo) {
            var hash;
            switch(algo) {
                case 'MD5': hash = CryptoJS.MD5(wordArray).toString(); break;
                case 'SHA-1': hash = CryptoJS.SHA1(wordArray).toString(); break;
                case 'SHA-256': hash = CryptoJS.SHA256(wordArray).toString(); break;
                case 'SHA-512': hash = CryptoJS.SHA512(wordArray).toString(); break;
                case 'CRC32': hash = crc32(new Uint8Array(e.target.result)); break;
            }
            computedHashes[algo] = hash;

            var card = document.getElementById('card-' + algo);
            if (card) {
                card.classList.remove('calculating');
                card.innerHTML =
                    '<div class="hash-icon">' + (icons[algo] || '🔐') + '</div>' +
                    '<div class="hash-info">' +
                        '<div class="hash-algo">' + algo + '</div>' +
                        '<div class="hash-value">' + hash + '</div>' +
                    '</div>' +
                    '<button class="copy-btn" onclick="copyHash(\'' + algo + '\')">📋 复制</button>';
            }
        });
    };
    reader.readAsArrayBuffer(currentFile);
}

// CRC32 计算
var crcTable = (function() {
    var t = [];
    for (var i = 0; i < 256; i++) {
        var c = i;
        for (var j = 0; j < 8; j++) {
            c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        }
        t[i] = c;
    }
    return t;
})();

function crc32(buf) {
    var crc = 0xFFFFFFFF;
    for (var i = 0; i < buf.length; i++) {
        crc = crcTable[(crc ^ buf[i]) & 0xFF] ^ (crc >>> 8);
    }
    return ((crc ^ 0xFFFFFFFF) >>> 0).toString(16).toUpperCase().padStart(8, '0');
}

function copyHash(algo) {
    if (computedHashes[algo]) {
        navigator.clipboard.writeText(computedHashes[algo]).then(function() {
            showToast('✅ ' + algo + ' 哈希值已复制');
        });
    }
}

function verifyHash() {
    var algo = document.getElementById('verifyAlgo').value;
    var expected = document.getElementById('expectedHash').value.trim().toLowerCase();
    var resultDiv = document.getElementById('verifyResult');

    if (!expected) { resultDiv.className = 'verify-result'; return; }
    if (!currentFile) { showToast('⚠️ 请先选择文件'); return; }
    if (!computedHashes[algo]) { showToast('⚠️ 请先选择 ' + algo + ' 算法计算'); return; }

    var actual = computedHashes[algo].toLowerCase();
    if (actual === expected) {
        resultDiv.className = 'verify-result match';
        resultDiv.innerHTML = '✅ <strong>哈希匹配！</strong>文件完整，与期望的 ' + algo + ' 哈希值一致。';
    } else {
        resultDiv.className = 'verify-result mismatch';
        resultDiv.innerHTML = '❌ <strong>哈希不匹配！</strong>文件可能已被篡改或损坏。';
    }
}

document.getElementById('expectedHash').addEventListener('input', function() {
    if (currentFile && this.value.trim()) verifyHash();
});

function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2000);
}
</script>
</body>
</html>
